<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Loading...</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent
}

:root{
  --p:#e0136c;
  --p2:#f43b87;
  --soft:#fff0f6;
  --dark:#222;
  --g:#16a56b
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f4f6;
  color:var(--dark);
  min-height:100vh
}

button,input,select{
  font-family:inherit
}

button{
  border:0;
  cursor:pointer;
  background:none
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:#f4f4f6;
  overflow:hidden;
  padding-bottom:80px
}

/* HEADER */
.header{
  background:linear-gradient(160deg,#e2136e,#f53a8a);
  padding:20px 18px 46px;
  color:#fff;
  position:relative;
  overflow:hidden;
  border-radius:0 0 28px 28px
}

.header:before{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  border-radius:50%;
  background:rgba(255,255,255,.1);
  right:-80px;
  top:-110px
}

.header:after{
  content:"";
  position:absolute;
  width:140px;
  height:140px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  left:-60px;
  bottom:-80px
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:relative;
  z-index:2
}

.profile{
  display:flex;
  align-items:center;
  gap:11px
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#fff;
  padding:2px;
  object-fit:cover
}

.pname{
  font-weight:800;
  font-size:16px;
  max-width:190px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.puser{
  font-size:11px;
  opacity:.85;
  margin-top:2px
}

.hbtn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:#fff;
  font-size:19px
}

/* BALANCE */
.balance-card{
  margin:-28px 16px 0;
  position:relative;
  z-index:3;
  background:#fff;
  border-radius:20px;
  padding:16px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 8px 28px rgba(226,19,110,.18)
}

.balance-card.tap{
  cursor:pointer;
  min-height:92px;
  overflow:hidden;
  position:relative;
  transition:transform .18s ease,box-shadow .25s ease;
  -webkit-tap-highlight-color:transparent;
  user-select:none
}

.balance-card.tap:active{
  transform:scale(.975);
  box-shadow:0 5px 18px rgba(226,19,110,.22)
}

.balance-card.tap::after{
  content:"";
  position:absolute;
  width:95px;
  height:95px;
  right:-30px;
  top:-38px;
  border-radius:50%;
  background:rgba(226,19,110,.06);
  pointer-events:none
}

.tap-label{
  font-size:12px;
  color:#777;
  font-weight:900;
  letter-spacing:.35px;
  transition:color .25s ease
}

.tap-hint{
  font-size:10px;
  color:#aaa;
  margin-top:4px;
  font-weight:600
}

.balance-hidden{
  font-size:26px;
  font-weight:900;
  color:var(--p);
  letter-spacing:3px
}

.bl{
  font-size:11px;
  color:#888;
  font-weight:700
}

.bv{
  font-size:26px;
  font-weight:900;
  color:var(--p);
  margin-top:3px;
  min-height:31px;
  display:flex;
  align-items:center
}

.balance-reveal{
  animation:balanceReveal .42s cubic-bezier(.2,.8,.2,1);
}

.balance-eye-pop{
  animation:balanceEyePop .38s cubic-bezier(.2,.8,.2,1);
}

@keyframes balanceReveal{
  0%{opacity:0;transform:translateY(10px) scale(.94);filter:blur(5px)}
  60%{opacity:1;transform:translateY(-2px) scale(1.03);filter:blur(0)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

@keyframes balanceEyePop{
  0%{transform:scale(.85) rotate(-8deg)}
  55%{transform:scale(1.12) rotate(4deg)}
  100%{transform:scale(1) rotate(0)}
}

.wbtn{
  background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;
  padding:11px 16px;
  border-radius:13px;
  font-size:12px;
  font-weight:800;
  animation:pulse 2s infinite
}

@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(226,19,110,.4)}
  50%{box-shadow:0 0 0 9px rgba(226,19,110,0)}
}

/* CONTENT */
.content{
  padding:18px 14px
}

.stitle{
  font-size:18px;
  font-weight:900;
  margin:6px 3px 13px;
  letter-spacing:.1px
}

/* QUICK SERVICE GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  background:#fff;
  border-radius:20px;
  padding:14px 6px;
  box-shadow:0 2px 12px rgba(0,0,0,.05)
}

.svc{
  text-align:center;
  padding:6px 2px;
  transition:.15s
}

.svc:active{
  transform:scale(.9)
}

/* UPDATED IMAGE ICON */
.sic{
  width:54px;
  height:54px;
  margin:auto;
  border-radius:14px;
  background:var(--soft);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  border:1.5px solid #fbd0e2;
  overflow:hidden;
  position:relative
}

.sic img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  border-radius:12px
}

.snm{
  font-size:13px;
  font-weight:900;
  margin-top:7px;
  color:#444
}

/* PAYMENT */
.payments{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
  margin:14px 0
}

.paybtn{
  background:#fff;
  border-radius:18px;
  padding:12px 10px;
  display:flex;
  align-items:center;
  gap:10px;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
  border:1.5px solid #f3dbe6;
  text-align:left
}

.paybtn:active{
  transform:scale(.97)
}

.paylogo{
  width:48px;
  height:48px;
  border-radius:14px;
  background:#fff0f6;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:1px solid #f7c3da
}

.paylogo img{
  max-width:38px;
  max-height:38px;
  object-fit:contain
}

.payname{
  font-size:15px;
  font-weight:900
}

.paysub{
  font-size:10px;
  font-weight:700;
  color:#888;
  margin-top:3px
}

/* ACTIVITY */
.activity{
  position:fixed;
  left:50%;
  top:16px;
  transform:translate(-50%,-18px);
  z-index:3000;
  width:min(330px,calc(100% - 24px));
  background:#fff;
  border:1px solid #f6d5e4;
  border-radius:15px;
  box-shadow:0 12px 30px rgba(0,0,0,.16);
  padding:10px 12px;
  display:none;
  align-items:center;
  gap:10px;
  opacity:0
}

.activity.show{
  display:flex;
  animation:actIn 1s ease forwards
}

.activity.out{
  animation:actOut .25s ease forwards
}

@keyframes actIn{
  to{
    opacity:1;
    transform:translate(-50%,0)
  }
}

@keyframes actOut{
  to{
    opacity:0;
    transform:translate(-50%,-18px)
  }
}

.activity-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--soft);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  flex-shrink:0
}

.activity-txt{
  min-width:0;
  font-size:11px;
  line-height:1.35
}

.activity-txt b{
  font-size:11px
}

.activity-txt span{
  display:block;
  color:#777;
  font-size:10px
}

.activity-amt{
  margin-left:auto;
  color:#16a56b;
  font-size:12px;
  font-weight:900;
  white-space:nowrap
}

.activity-demo{
  display:block;
  margin-top:2px;
  color:#999;
  font-size:8px;
  font-weight:700
}

/* BANNER */
.banner-box{
  margin:16px 0;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 3px 15px rgba(0,0,0,.07);
  background:#fff;
  line-height:0
}

.banner{
  width:100%;
  height:auto;
  max-height:none;
  object-fit:contain;
  display:block;
  cursor:pointer;
  background:#fff
}

.banner-info{
  background:#fff;
  padding:12px 13px
}

.banner-title{
  font-size:14px;
  font-weight:900
}

.banner-link{
  display:block;
  margin-top:7px;
  color:var(--p);
  font-size:11px;
  font-weight:800;
  word-break:break-all;
  text-decoration:none
}

.banner-open{
  display:inline-flex;
  margin-top:9px;
  background:var(--p);
  color:#fff;
  padding:8px 12px;
  border-radius:10px;
  font-size:10px;
  font-weight:900
}

.bph{
  height:140px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#e2136e,#ff5899);
  color:#fff;
  font-size:20px;
  font-weight:900
}

/* ROW */
.row{
  width:100%;
  background:#fff;
  border-radius:16px;
  padding:13px;
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:9px;
  text-align:left;
  box-shadow:0 2px 10px rgba(0,0,0,.04)
}

.row b{
  display:block;
  font-size:15px;
  font-weight:900
}

.row span.s{
  display:block;
  font-size:11px;
  font-weight:700;
  color:#888;
  margin-top:3px
}

.ric{
  width:48px;
  height:48px;
  border-radius:14px;
  background:var(--soft);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  border:1.5px solid #fbd0e2;
  flex-shrink:0;
  object-fit:cover
}

.arrow{
  margin-left:auto;
  font-size:21px;
  color:var(--p)
}

/* TUTORIAL / VISUAL ICON */
.tutorial-logo{
  width:48px;
  height:48px;
  border-radius:14px;
  object-fit:cover;
  flex-shrink:0;
  border:1.5px solid #f7c3da;
  background:#fff;
  box-shadow:0 3px 10px rgba(226,19,110,.12)
}

.ref-rate{
  margin-top:12px;
  background:#fff;
  border:1.5px solid #f7c3da;
  border-radius:16px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}

.ref-rate .label{
  margin:0;
  font-size:12px;
  color:#777;
  font-weight:800
}

.ref-rate .amount{
  font-size:22px;
  color:var(--p);
  font-weight:900
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  height:66px;
  background:#fff;
  border-top:1px solid #eee;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:50;
  box-shadow:0 -5px 20px rgba(0,0,0,.06)
}

.ni{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  color:#888;
  font-size:11px;
  font-weight:900
}


.tg-nav-icon{
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  overflow:hidden;
  border-radius:50%;
}
.tg-nav-icon img{
  width:24px;
  height:24px;
  display:block;
  object-fit:cover;
  border-radius:50%;
}

.ni i{
  font-style:normal;
  font-size:24px;
  line-height:1
}

.ni.active{
  color:var(--p)
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.5)
}

.modal.show{
  display:flex
}

.mbox{
  width:min(520px,100%);
  margin:auto;
  max-height:92vh;
  overflow:auto;
  background:#f4f4f6;
  border-radius:26px 26px 0 0;
  animation:up .28s cubic-bezier(.2,.9,.3,1.1)
}

@keyframes up{
  from{transform:translateY(100%)}
  to{transform:none}
}

.mhead{
  position:sticky;
  top:0;
  z-index:3;
  background:linear-gradient(135deg,#e2136e,#f53a8a);
  color:#fff;
  padding:16px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.mtitle{
  font-size:17px;
  font-weight:900
}

.close{
  width:34px;
  height:34px;
  border-radius:50%;
  background:rgba(255,255,255,.22);
  color:#fff;
  font-size:20px
}

.mc{
  padding:16px 15px 32px
}

.label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin:14px 0 7px;
  color:#555
}

.input{
  width:100%;
  height:49px;
  background:#fff;
  border:1.5px solid #e8e8e8;
  border-radius:13px;
  padding:0 14px;
  outline:none;
  font-size:14px
}

.input:focus{
  border-color:var(--p)
}

.pbtn{
  width:100%;
  height:50px;
  margin-top:16px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;
  font-size:14px;
  font-weight:900;
  box-shadow:0 7px 18px rgba(226,19,110,.25)
}

.pbtn:disabled{
  background:#ccc;
  box-shadow:none
}

.card{
  background:#fff;
  border-radius:18px;
  padding:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.04)
}

.info{
  background:#fff5f9;
  padding:12px;
  border-radius:13px;
  font-size:11px;
  line-height:1.7;
  color:#777;
  margin-top:10px
}

.info b{
  color:var(--p)
}

/* METHODS */
.methods{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.method{
  background:#fff;
  border:2px solid #eee;
  border-radius:14px;
  padding:12px 6px;
  text-align:center;
  font-size:12px;
  font-weight:800;
  transition:.2s
}

.method img{
  height:30px;
  max-width:80px;
  object-fit:contain;
  display:block;
  margin:0 auto 6px
}

.method.sel{
  border-color:var(--p);
  background:var(--soft);
  transform:scale(1.03)
}

/* LIST */
.list{
  display:flex;
  flex-direction:column;
  gap:9px
}

.li{
  background:#fff;
  border-radius:15px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:11px;
  border:1px solid #f0f0f0
}

.li .in{
  flex:1;
  min-width:0
}

.li b{
  display:block;
  font-size:13px
}

.li span{
  display:block;
  font-size:10px;
  color:#888;
  margin-top:3px
}

.sbtn{
  background:var(--p);
  color:#fff;
  border-radius:10px;
  padding:9px 13px;
  font-size:10px;
  font-weight:800
}

.sbtn:disabled{
  opacity:.5
}

.empty{
  text-align:center;
  padding:28px 15px;
  color:#999;
  font-size:12px
}

/* REFERRAL */
.refc{
  background:linear-gradient(135deg,#e2136e,#f43b87);
  color:#fff;
  border-radius:20px;
  padding:19px
}

.refcode{
  font-size:24px;
  font-weight:900;
  letter-spacing:1px;
  margin:6px 0 13px
}

.reflink{
  background:rgba(255,255,255,.17);
  padding:10px;
  border-radius:11px;
  font-size:11px;
  word-break:break-all
}

.refb{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:11px
}

.refb button{
  height:42px;
  border-radius:12px;
  background:#fff;
  color:var(--p);
  font-weight:900
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:12px
}

.stat{
  background:#fff;
  border-radius:14px;
  padding:13px 6px;
  text-align:center
}

.stat b{
  display:block;
  color:var(--p);
  font-size:17px
}

.stat span{
  font-size:9px;
  color:#888
}

/* ADS */
.premium{
  background:#fff;
  border:2px solid var(--p);
  border-radius:22px;
  padding:16px 12px;
  background-image:linear-gradient(180deg,#fff,#fff0f6)
}

.ptitle{
  text-align:center;
  font-size:18px;
  font-weight:900;
  color:var(--p)
}

.psub{
  text-align:center;
  font-size:11px;
  color:#777;
  margin:6px 0 14px;
  line-height:1.6
}

.ads{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px
}

.ad{
  position:relative;
  background:#fff;
  border:1.5px solid #f7c3da;
  border-radius:18px;
  padding:14px 8px 10px;
  text-align:center;
  transition:.15s
}

.ad:active{
  transform:scale(.96)
}

.adtag{
  position:absolute;
  top:-9px;
  right:-3px;
  background:linear-gradient(135deg,#ff7a00,#ff9a2e);
  color:#fff;
  font-size:9px;
  font-weight:800;
  padding:5px 9px;
  border-radius:12px;
  animation:bob 1.2s infinite
}

@keyframes bob{
  50%{transform:translateY(-3px)}
}

.adplay{
  width:60px;
  height:60px;
  border-radius:18px;
  margin:6px auto 9px;
  background:linear-gradient(145deg,#e2136e,#ff5b9d);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:26px;
  box-shadow:0 6px 14px rgba(226,19,110,.3)
}

.ad b{
  font-size:13px;
  display:block
}

.ad small{
  display:block;
  font-size:10px;
  color:#888;
  margin:4px 0 9px
}

.adcnt{
  background:var(--soft);
  color:var(--p);
  font-size:11px;
  font-weight:800;
  padding:7px;
  border-radius:20px;
  border:1px solid #f7c3da
}

/* SPIN */
.spin{
  background:#fff;
  border-radius:22px;
  padding:18px 12px;
  text-align:center
}

.timer{
  display:inline-block;
  background:var(--soft);
  border:1px solid #f7c3da;
  color:var(--p);
  font-weight:900;
  padding:10px 20px;
  border-radius:30px;
  margin:10px 0;
  font-size:15px
}

.ww{
  position:relative;
  width:280px;
  height:280px;
  margin:14px auto
}

.wheel{
  width:280px;
  height:280px;
  border-radius:50%;
  border:8px solid #fff;
  outline:4px solid var(--p);
  box-shadow:0 6px 24px rgba(226,19,110,.3);
  transition:transform 4.5s cubic-bezier(.12,.75,.17,1);
  position:relative;
  background:conic-gradient(
    #e91e63 0 45deg,
    #9c27b0 45deg 90deg,
    #3f51b5 90deg 135deg,
    #009688 135deg 180deg,
    #ff9800 180deg 225deg,
    #4caf50 225deg 270deg,
    #00bcd4 270deg 315deg,
    #f44336 315deg 360deg
  )
}

.wl{
  position:absolute;
  left:50%;
  top:50%;
  width:0;
  height:0
}

.wl span{
  position:absolute;
  left:-24px;
  top:-112px;
  width:48px;
  text-align:center;
  color:#fff;
  font-size:12px;
  font-weight:900;
  text-shadow:0 1px 3px rgba(0,0,0,.4)
}

.wc{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:70px;
  height:70px;
  border-radius:50%;
  background:#fff;
  color:var(--p);
  font-weight:900;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 3px 12px rgba(0,0,0,.2);
  z-index:2
}

.ptr{
  position:absolute;
  top:-10px;
  left:50%;
  transform:translateX(-50%);
  border-left:12px solid transparent;
  border-right:12px solid transparent;
  border-top:24px solid #222;
  z-index:4
}

/* MINING */
.mcard{
  background:linear-gradient(135deg,#c20f5d,#f53a8a);
  color:#fff;
  border-radius:24px;
  padding:22px;
  text-align:center
}

.ring{
  width:190px;
  height:190px;
  border-radius:50%;
  margin:14px auto;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative
}

.ring:before{
  content:"";
  position:absolute;
  inset:11px;
  border-radius:50%;
  background:#d6126a
}

.ringin{
  position:relative;
  z-index:2
}

.ringin small{
  font-size:11px;
  opacity:.85
}

.ringin b{
  display:block;
  font-size:30px;
  margin:3px 0
}

.mbtn{
  width:100%;
  height:48px;
  background:#fff;
  color:var(--p);
  border-radius:14px;
  font-weight:900;
  margin-top:6px
}

.mbtn:disabled{
  opacity:.7
}

.tiers{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:14px
}

.tier{
  background:rgba(255,255,255,.15);
  border-radius:11px;
  padding:9px 3px;
  font-size:9px
}

.tier b{
  display:block;
  font-size:11px;
  margin-bottom:2px
}

/* POPUP */
.pop{
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:25px
}

.pop.show{
  display:flex;
  animation:fade .2s
}

@keyframes fade{
  from{opacity:0}
}

.popbox{
  position:relative;
  width:100%;
  max-width:330px;
  background:#fff;
  border-radius:26px;
  padding:30px 22px 22px;
  text-align:center;
  animation:pp .5s cubic-bezier(.2,1.4,.4,1);
  overflow:hidden
}

@keyframes pp{
  from{
    transform:scale(.3);
    opacity:0
  }
}

.pic{
  width:84px;
  height:84px;
  border-radius:50%;
  margin:0 auto 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--p),var(--p2));
  box-shadow:0 0 0 0 rgba(226,19,110,.5);
  animation:ring 1.6s infinite
}

.pic.err{
  background:linear-gradient(135deg,#ef4444,#f97316)
}

@keyframes ring{
  70%{
    box-shadow:0 0 0 20px rgba(226,19,110,0)
  }
  100%{
    box-shadow:0 0 0 0 rgba(226,19,110,0)
  }
}

.pic svg{
  width:44px;
  height:44px
}

.pic path{
  stroke:#fff;
  stroke-width:5;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:60;
  stroke-dashoffset:60;
  animation:draw .6s .3s forwards
}

@keyframes draw{
  to{stroke-dashoffset:0}
}

.pt{
  font-size:19px;
  font-weight:900
}

.pm{
  font-size:12px;
  color:#777;
  margin-top:7px;
  line-height:1.6
}

.pa{
  font-size:32px;
  font-weight:900;
  color:var(--p);
  margin-top:9px;
  animation:pp .6s .3s both
}

.pok{
  width:100%;
  height:46px;
  margin-top:18px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;
  font-weight:900
}

.cf{
  position:absolute;
  top:-10px;
  width:8px;
  height:12px;
  border-radius:2px;
  animation:fall 1.8s ease-in forwards
}

@keyframes fall{
  to{
    transform:translateY(420px) rotate(540deg);
    opacity:0
  }
}

.wait{
  font-size:46px;
  font-weight:900;
  color:var(--p);
  margin:6px 0
}

.bar{
  height:8px;
  background:#fde0ec;
  border-radius:9px;
  overflow:hidden;
  margin-top:12px
}

.bar div{
  height:100%;
  width:0;
  background:var(--p);
  transition:width 1s linear
}

/* LOADING */
.loading{
  position:fixed;
  inset:0;
  z-index:999;
  background:linear-gradient(160deg,#e2136e,#f53a8a);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column
}

.logo{
  width:84px;
  height:84px;
  border-radius:26px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
  animation:bob2 1.6s infinite
}

@keyframes bob2{
  50%{
    transform:translateY(-8px) scale(1.04)
  }
}

.logo img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:8px
}

.spinner{
  width:27px;
  height:27px;
  border:3px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:sp 1s linear infinite;
  margin-top:15px
}

@keyframes sp{
  to{transform:rotate(360deg)}
}

.toast{
  position:fixed;
  z-index:1000;
  left:50%;
  bottom:85px;
  transform:translateX(-50%) translateY(20px);
  background:#222;
  color:#fff;
  padding:12px 17px;
  border-radius:12px;
  font-size:12px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  max-width:90%;
  text-align:center
}

.toast.show{
  opacity:1;
  transform:translateX(-50%)
}
/* BOLD TEXT + BUTTONS */
body{font-weight:600}
button{font-weight:800}
.pbtn,.sbtn,.mbtn,.pok,.wbtn,.refb button,.svc .snm,.paybtn .payname{font-weight:900}
.info{font-weight:700;color:#555}

.rules{background:#fff;border:1.5px dashed #f7c3da;border-radius:14px;padding:12px 14px;margin-top:14px;font-size:12px;font-weight:700;line-height:1.8;color:#444}
.rules .rt{display:block;color:var(--p);font-size:14px;font-weight:900;margin-bottom:4px}
.rules ol{padding-left:18px}
.rules li{margin-top:2px}

/* =========================================================
   HELPERS
========================================================= */

function esc(v){

  return v==null
    ?""
    :String(v)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

}


function money(v){

  return Number(v||0).toLocaleString(
    "en-US",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


function showToast(m){

  const e=document.getElementById("toast");

  e.innerText=m;

  e.classList.add("show");

  setTimeout(
    ()=>e.classList.remove("show"),
    2500
  );

}


function formatDate(t){

  return t
    ?new Date(t).toLocaleString(
      "en-GB",
      {
        day:"2-digit",
        month:"short",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
      }
    )
    :"";

}


function todayKey(){

  const d=new Date();

  return d.getFullYear()
    +"-"
    +String(d.getMonth()+1).padStart(2,"0")
    +"-"
    +String(d.getDate()).padStart(2,"0");

}

function showPopup(title,msg,amount,isErr){

  const b=document.getElementById("popBox");

  const icon=isErr
    ?'<path d="M14 14L34 34M34 14L14 34"/>'
    :'<path d="M10 25L21 36L38 14"/>';

  let cf="";

  if(!isErr){

    const c=[
      "#e2136e",
      "#ff9800",
      "#4caf50",
      "#3f51b5",
      "#ffb800"
    ];

    for(let i=0;i<26;i++){

      cf+=
        `<i class="cf"
        style="left:${Math.random()*100}%;
        background:${c[i%5]};
        animation-delay:${Math.random()*.5}s"></i>`;

    }

  }

  b.innerHTML=
    cf+
    `<div class="pic ${isErr?"err":""}">
      <svg viewBox="0 0 48 48">${icon}</svg>

    <button class="pok" onclick="closePopup()">OK</button>`;

  document
    .getElementById("pop")
    .classList.add("show");

  if(
    tg &&
    tg.HapticFeedback
  ){
    try{
      tg.HapticFeedback.notificationOccurred(
        isErr?"error":"success"
      );
    }catch(e){}
  }

}


function closePopup(){

  document
    .getElementById("pop")
    .classList.remove("show");

    if(
      v!==undefined &&
      v!==null &&
      String(v).trim()!==""
    ){
      return v;
    }

  }

  return"";

}

const createReferralCode=id=>String(id);


async function initializeUser(){

  currentUser=getTelegramUser();

  userRef=
    db.ref("users/"+currentUser.id);

  const snap=
    await userRef.once("value");

  if(snap.exists()){

    userData=snap.val()||{};

  }else{

    userData={
      telegramId:String(currentUser.id),
      firstName:currentUser.first_name||"",
      lastName:currentUser.last_name||"",
      username:currentUser.username||"",
      photoUrl:currentUser.photo_url||"",
      balance:0,
      referralCode:String(currentUser.id),
      referredBy:"",
      totalReferrals:0,
      referralEarnings:0,
      totalWithdraw:0,
      createdAt:TS,
      lastActive:TS
    };

    await userRef.set(userData);

  }

  await userRef.update({

    firstName:
      currentUser.first_name||
      userData.firstName||
      "",

    lastName:
      currentUser.last_name||
      userData.lastName||
      "",

    username:
      currentUser.username||
      userData.username||
      "",

    photoUrl:
      currentUser.photo_url||
      userData.photoUrl||
      "",

    lastActive:TS,

    referralCode:
      String(currentUser.id)

  });

  userData=
    (
      await userRef.once("value")
    ).val()||userData;

  await processReferral();

  updateProfileUI();

}


function getStartParam(){

  try{

    if(
      tg &&
      tg.initDataUnsafe &&
      tg.initDataUnsafe.start_param
    ){
      return tg.initDataUnsafe.start_param;
    }

  }catch(e){}

  return new URLSearchParams(
    location.search
  ).get("ref")||"";

}


async function processReferral(){

  let c=
    String(
      getStartParam()||""
    ).trim();

  if(!c||userData.referredBy)return;

  if(c.startsWith("ref_"))
    c=c.substring(4);

  if(c.startsWith("REF"))
    c=c.substring(3);

  const rid=String(c);

  if(
    !/^\d+$/.test(rid)||
    rid===String(currentUser.id)
  )return;

  const refSnap=
    await db
      .ref("users/"+rid)
      .once("value");

  if(!refSnap.exists())return;

  const oldRef=
    await db
      .ref(
        "referrals/"
        +rid+
        "/"
        +currentUser.id
      )
      .once("value");

  if(oldRef.exists()){

    await userRef.update({
      referredBy:rid
    });

    return;

  }

  await db
    .ref(
      "referrals/"
      +rid+
      "/"
      +currentUser.id
    )
    .set({

      referrerId:rid,

      referredId:
        String(currentUser.id),

      referredName:[
        currentUser.first_name||"",
        currentUser.last_name||""
      ].join(" ").trim(),

      referredUsername:
        currentUser.username||"",

      createdAt:TS

    });

  await userRef.update({
    referredBy:rid
  });

  const rr=
    db.ref("users/"+rid);

  const ru=
    refSnap.val()||{};

  await rr.update({
    totalReferrals:
      Number(ru.totalReferrals||0)+1
  });

  const reward=
    Number(settings.referralReward||0);

  if(reward>0){

    await db
      .ref(
        "referralRewards/"
        +rid+
        "/"
        +currentUser.id
      )
      .set({
        amount:reward,
        createdAt:TS,
        status:"pending"
      });

  }

}

function pickMethod(id){

  id=String(id||"").toLowerCase();

  if(
    id!=="bkash"&&
    id!=="nagad"
  )return;

  wSel=id;

  document
    .querySelectorAll(".method")
    .forEach(
      b=>
      b.classList.toggle(
        "sel",
        b.dataset.id===id
      )
    );

}


async function submitWithdraw(){

  const amount=
    Number(
      document.getElementById(
        "withdrawAmount"
      ).value
    );

  const number=
    document.getElementById(
      "withdrawNumber"
    ).value.trim();

  const minW=
    Number(settings.minWithdraw||0);

  const minR=
    Number(settings.minRefer||0);

  const bal=
    Number(userData.balance||0);

  const refs=
    Number(userData.totalReferrals||0);

  const err=
    m=>
    showPopup(
      "Failed",
      m,
      null,
      true
    );

  if(
    wSel!=="bkash"&&
    wSel!=="nagad"
  )
    return err("Select withdraw method");

  if(!amount||amount<=0)
    return err("Enter valid amount");

  if(amount<minW)
    return err(
      "Minimum withdraw ৳"+minW
    );

  if(refs<minR)
    return err(
      "You need at least "
      +minR+
      " referrals"
    );

  if(amount>bal)
    return err(
      "Insufficient balance"
    );

  if(!number)
    return err(
      "Enter account number"
    );

  if(!/^01\d{9}$/.test(number))
    return err(
      "Enter a valid 11 digit account number"
    );

  const method=
    wMethods.find(
      x=>x.id===wSel
    );

  const id=
    db
      .ref("withdrawals")
      .push()
      .key;

  await db
    .ref("withdrawals/"+id)
    .set({

      id,

      userId:
        String(currentUser.id),

      userName:[
        currentUser.first_name||"",
        currentUser.last_name||""
      ].join(" ").trim(),

      username:
        currentUser.username||"",

      amount,

      methodId:
        method.id,

      methodName:
        method.name,

      accountNumber:number,

      status:"pending",

      createdAt:TS

    });

  closeModal();

  showPopup(
    "Request Submitted!",
    method.name+
    " withdraw request submitted successfully. It is pending processing.",
    amount
  );

}

        .ref("withdrawals")
        .orderByChild("createdAt")
        .limitToLast(50)
        .once("value");

    snap.forEach(c=>{
      const d=c.val()||{};
      const st=String(d.status||"").toLowerCase();

      if(
        [
          "approved",
          "completed",
          "paid",
          "success",
          "successful"
        ].includes(st) &&
        Number(d.amount)>0
      ){
        realRows.push(d);
      }
    });

    realRows.sort(
      (a,b)=>
        Number(b.createdAt||0)-
        Number(a.createdAt||0)
    );
  }catch(e){
    console.error("Activity load error:",e);
  }

  let realIndex=0;
  let sampleIndex=Math.floor(Math.random()*sampleNames.length);

  const showActivity=(item,isSample=false)=>{
    const el=document.getElementById("activityPopup");
    if(!el)return;

    const name=String(item.name||"User").trim()||"User";
    const amount=Number(item.amount||0);

    el.classList.remove("out");

    el.innerHTML=`
      <div class="activity-avatar">
        ${isSample?"✨":"💸"}
      </div>

      <div class="activity-txt">
        <b>${esc(name)}</b>
        <span>${isSample
          ?"Recently withdrawal"
          :"Verified withdrawal completed"}</span>
        ${isSample
          ?'<small class="activity-demo">Live preview</small>'
          :''}
      </div>

      <div class="activity-amt">
        ৳${money(amount)}
      </div>`;

    el.classList.add("show");

    clearTimeout(activityTimer);

    activityTimer=setTimeout(()=>{
      el.classList.add("out");

      setTimeout(()=>{
        el.classList.remove("show","out");
      },300);

    },5200);
  };

  const showNext=()=>{
    /*
      Prefer a real approved withdrawal if one exists.
      Otherwise (or after the real list is exhausted), show a
      clearly-labeled sample entry.
    */
    if(realRows.length && realIndex<realRows.length){
      const d=realRows[realIndex++];

      showActivity({
        name:
          String(
            d.userName||
            d.name||
            "Telegram User"
          ).trim() || "Telegram User",
        amount:Number(d.amount||0)
      },false);

    }else{
      const name=sampleNames[sampleIndex++%sampleNames.length];

      // Demo amount only; it is explicitly labeled as sample activity.
      const amounts=[50,80,100,120,150,200,250,300,350,500];
      const amount=
        amounts[
          Math.floor(Math.random()*amounts.length)
        ];

      showActivity({name,amount},true);
    }
  };

  // First popup after a short delay.
  setTimeout(showNext,7000);

  // Exactly one popup per minute.
  clearInterval(window.__activityInterval);
  window.__activityInterval=setInterval(
    showNext,
    60000
  );
}

function loadMonetag(){

  const fnName=

    );

  if(old)
    old.remove();

  document
    .querySelectorAll(
      "script[data-tkpay-monetag]"
    )
    .forEach(
      x=>x.remove()
    );

  const sc=
    document.createElement(
      "script"

    "tkpayMonetagSDK";

  sc.src=
    "//libtl.com/sdk.js";

  sc.async=true;

async function showMonetagReward(){

      sv("monetagZoneId")||
      "8449094"
    )
    .replace(/[^0-9]/g,"")
    ||"8449094";

  const fnName=
    "show_"+zone;

    loadMonetag();
  }

  for(let i=0;i<12;i++){

    if(
      typeof window[fnName]==="function"
    ){

      try{

        await Promise.resolve(
          window[fnName]()
        );

          ok:true

      0,
      Math.floor(ms/1000)

    Math.floor(
      s%3600/60
    ),
    s%60
  ]
  .map(
    x=>String(x).padStart(2,"0")
  )
  .join(":");

}

function getMiningTier(r){

  return[
    {
      min:0,
      max:2,
      low:30,
      high:40
    },
    {
      min:3,
      max:5,
      low:50,
      high:50
    },
    {
      min:6,
      max:9,
      low:70,
      high:70
    },
    {
      min:10,
      max:999999,
      low:100,
      high:120
    }
  ].find(
    t=>
      r>=t.min&&
      r<=t.max
  );

}


const miningReward=
  r=>{

    const t=
      getMiningTier(r);

    return Math.floor(
      Math.random()*
      (t.high-t.low+1)
    )+
    t.low;

  };


const miningProgress=
  l=>
    !l
    ?0
    :Math.min(
      100,
      Math.max(
        0,
        (
          Date.now()-
          Number(l)
        )/DAY*100
      )
    );

async function startMining(){

  const ref=
    db.ref(
      "mining/"
      +currentUser.id
    );

  const m=
    (
      await ref.once("value")
    ).val()||{};

  const now=
    Date.now();

  if(
    m.status==="mining"&&
    m.lastStart&&
    now-
    Number(m.lastStart)
    <DAY
  )
    return showPopup(
      "Already Running",
      "Mining is already running.",
      null,
      true
    );

  const refs=
    Number(
      userData.totalReferrals||0
    );

  await ref.set({

    lastStart:now,

    reward:
      miningReward(refs),

    status:"mining",

    referralCount:refs,

    updatedAt:TS

  });

  showPopup(
    "Mining Started ⛏️",
    "Come back after 24 hours to claim your reward."
  );

  openMining();

}


async function claimMining(){

  const ref=
    db.ref(
      "mining/"
      +currentUser.id
    );

  const m=
    (
      await ref.once("value")
    ).val()||{};

  const last=
    Number(
      m.lastStart||0
    );

  const reward=
    Number(
      m.reward||0
    );

  if(
    m.status!=="mining"||
    !last||
    Date.now()-last<DAY
  )
    return showPopup(
      "Not Ready",
      "Your mining cycle is not complete yet.",
      null,
      true
    );

  if(!reward)
    return showPopup(
      "Error",
      "No mining reward available.",
      null,
      true
    );

  const k=
    db
      .ref("rewardClaims")
      .push()
      .key;

  await db
    .ref(
      "rewardClaims/"+k
    )
    .set({

      type:"mining",

      userId:
        String(currentUser.id),

      amount:reward,

      source:"daily_mining",

      status:"pending",

      createdAt:TS

    });

  await ref.update({

    lastClaim:TS,

    status:"claimed"

  });

  showPopup(
    "Mining Reward!",
    "Your mining claim has been submitted.",
    reward
  );

  openMining();

}

}

function openOfficial(){

async function openNotice(){

  const snap=
    await db
      .ref("notices")
      .once("value");

  let h="";

  snap.forEach(
    ch=>{

      const n=
        ch.val()||{};

      if(
        n.status===false||
        n.status==="inactive"
      )return;

      h+=
        `<div
          class="card"
          style="border-left:4px solid var(--p)">

          <b
            style="font-size:14px">

            ${esc(
              n.title||"Notice"
            )}

          </b>

          <p
            style="color:#666;font-size:12px;line-height:1.6;margin-top:7px">

            ${esc(
              n.text||
              n.description||
              ""
            )}

          </p>

          <small
            style="display:block;color:#aaa;margin-top:9px">

            ${formatDate(
              n.date||
              n.createdAt
            )}

          </small>

        </div>`;

    }
  );

  openModal(
    "Notice",

    `<div class="list">

      ${
        h||
        '<div class="empty">No notices available.</div>'
      }

    </div>`
  );

}

/* =========================================================
   PAGE ROUTER
========================================================= */

async function openPage(p){

  try{

    const m={
      withdraw:openWithdraw,
      refer:openRefer,
      task:openTasks,
      bonus:openBonus,
      spin:openSpin,
      ads:openAds,
      mining:openMining,
      support:openSupport,
      official:openOfficial,
      notice:openNotice,
      tutorial:openTutorial
    };

    if(m[p])
      await m[p]();

  }catch(e){

    console.error(e);

    showPopup(
      "Oops",
      "Something went wrong.",
      null,
      true
    );

  }

}


/* =========================================================
   TELEGRAM / EXTERNAL LINK
========================================================= */

function openTelegram(u){

  if(!u)
    return showPopup(
      "Not Available",
      "Support is not configured.",
      null,
      true
    );

  const url=
    /^https?:\/\//i.test(u)
    ?u
    :"https://t.me/"+u;

  if(
    tg &&
    tg.openTelegramLink &&
    url.includes("t.me/")
  )
    tg.openTelegramLink(url);
  else
    window.open(
      url,
      "_blank"
    );

}


function openExternal(u){

  if(!u)
    return showPopup(
      "Not Available",
      "Link not configured.",
      null,
      true
    );

  if(
    tg &&
    tg.openLink
  )
    tg.openLink(u);
  else
    window.open(
      u,
      "_blank"
    );

}


/* =========================================================
   BANNER
========================================================= */

function loadBanner(){

  const box=
    document.getElementById(
      "bannerBox"
    );

  if(!box)return;

  const bannerUrl=
    "https://i.ibb.co/GfL8xMpN/Tkpay-Free-Earning-Bot-Banner.png";

  box.innerHTML=
    `<a
      href="${bannerUrl}"
      target="_blank"
      rel="noopener"
      style="display:block;line-height:0">

      <img
        class="banner"
        src="${bannerUrl}"
        alt="TK Pay Free Earning Bot Banner">

    </a>`;

}


/* =========================================================
   START APP
========================================================= */

async function startApp(){

  try{

    initTelegram();

    const L=
      document.getElementById(
        "loaderText"
      );

    L.innerText=
      "Loading settings...";

    await loadSettings();

    L.innerText=
      "Loading account...";

    await initializeUser();

    listenUser();

    loadBanner();

    await loadMonetag();

    loadRecentWithdrawActivity();

    await new Promise(
      r=>setTimeout(r,1200)
    );

    document.getElementById(
      "loading"
    ).style.display="none";

  }catch(e){

    console.error(e);

    document.getElementById(
      "loaderText"
    ).innerText=
      "Failed to load";

    showToast(
      e.message||
      "Application failed to start"
    );

  }

}

startApp();

</script>
