<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Loading...</title>

<!-- Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --pink:#e2136e;
    --pink2:#f42b82;
    --pink3:#ff5b9d;
    --dark:#202124;
    --gray:#707070;
    --light:#f7f7f8;
    --white:#fff;
    --green:#16a56b;
    --red:#ef4444;
    --yellow:#ffb800;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f6f7;
    color:var(--dark);
    min-height:100vh;
}

button,
input,
select{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    max-width:520px;
    margin:auto;
    min-height:100vh;
    background:#f7f7f8;
    overflow:hidden;
}

/* ================= HEADER ================= */

.header{
    position:relative;
    background:linear-gradient(145deg,#e2136e,#f53a8a);
    padding:22px 18px 28px;
    color:white;
    overflow:hidden;
}

.header:before,
.header:after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.09);
}

.header:before{
    width:210px;
    height:210px;
    right:-90px;
    top:-110px;
}

.header:after{
    width:150px;
    height:150px;
    left:-90px;
    bottom:-100px;
}

.topbar{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.profile{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:55px;
    height:55px;
    border-radius:50%;
    background:white;
    padding:3px;
    object-fit:cover;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.profile-info{
    min-width:0;
}

.profile-name{
    font-size:18px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:200px;
}

.profile-user{
    font-size:12px;
    opacity:.85;
    margin-top:3px;
}

.menu-btn{
    width:44px;
    height:44px;
    border-radius:50%;
    background:white;
    color:var(--pink);
    font-size:21px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

/* ================= BALANCE ================= */

.balance-card{
    position:relative;
    z-index:3;
    margin:-12px 16px 0;
    background:white;
    border-radius:20px;
    padding:17px 18px;
    box-shadow:0 8px 30px rgba(0,0,0,.10);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.balance-label{
    color:#777;
    font-size:12px;
    font-weight:700;
}

.balance{
    font-size:25px;
    font-weight:900;
    color:var(--pink);
    margin-top:4px;
}

.withdraw-mini{
    background:var(--pink);
    color:white;
    padding:11px 15px;
    border-radius:13px;
    font-size:12px;
    font-weight:800;
}

/* ================= CONTENT ================= */

.content{
    padding:20px 15px 100px;
}

.section-title{
    font-size:18px;
    font-weight:900;
    margin:5px 3px 13px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.service{
    background:white;
    border-radius:18px;
    padding:13px 4px 12px;
    text-align:center;
    box-shadow:0 2px 12px rgba(0,0,0,.045);
    border:1px solid #f0f0f0;
    transition:.18s;
}

.service:active{
    transform:scale(.95);
}

.service-icon{
    width:48px;
    height:48px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    background:#fff1f7;
}

.service-name{
    font-size:11px;
    font-weight:800;
    margin-top:9px;
    color:#333;
}

/* ================= BANNER ================= */

.banner-box{
    margin:20px 0;
    border-radius:18px;
    overflow:hidden;
    background:white;
    min-height:130px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.banner{
    width:100%;
    height:145px;
    object-fit:cover;
    display:block;
}

.banner-placeholder{
    height:145px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#e2136e,#ff5899);
    color:white;
    font-size:20px;
    font-weight:900;
}

/* ================= QUICK CARDS ================= */

.quick{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:15px;
}

.quick-card{
    background:white;
    border-radius:17px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:11px;
    box-shadow:0 2px 12px rgba(0,0,0,.04);
}

.quick-icon{
    width:40px;
    height:40px;
    border-radius:12px;
    background:#fff0f6;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.quick-text b{
    display:block;
    font-size:13px;
}

.quick-text span{
    display:block;
    font-size:10px;
    color:#888;
    margin-top:3px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    z-index:50;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(520px,100%);
    height:68px;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(15px);
    border-top:1px solid #eee;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    box-shadow:0 -5px 25px rgba(0,0,0,.06);
}

.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#777;
    font-size:10px;
    font-weight:800;
}

.nav-item span:first-child{
    font-size:21px;
}

.nav-item.active{
    color:var(--pink);
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:flex-end;
    background:rgba(0,0,0,.45);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(520px,100%);
    max-height:92vh;
    overflow:auto;
    background:#f7f7f8;
    border-radius:25px 25px 0 0;
    animation:slideUp .22s ease;
}

@keyframes slideUp{
    from{transform:translateY(100%)}
    to{transform:translateY(0)}
}

.modal-head{
    position:sticky;
    top:0;
    z-index:3;
    background:white;
    padding:17px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #eee;
}

.modal-title{
    font-size:18px;
    font-weight:900;
}

.close{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#f2f2f2;
    font-size:19px;
}

.modal-content{
    padding:17px;
    padding-bottom:35px;
}

/* ================= FORM ================= */

.label{
    display:block;
    font-size:12px;
    font-weight:800;
    margin:14px 0 7px;
    color:#555;
}

.input,
.select{
    width:100%;
    height:49px;
    background:white;
    border:1px solid #e5e5e5;
    border-radius:13px;
    padding:0 14px;
    outline:none;
    font-size:14px;
}

.input:focus,
.select:focus{
    border-color:var(--pink);
}

.primary-btn{
    width:100%;
    height:50px;
    margin-top:16px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--pink),var(--pink2));
    color:white;
    font-size:14px;
    font-weight:900;
    box-shadow:0 7px 18px rgba(226,19,110,.20);
}

.secondary-btn{
    width:100%;
    height:48px;
    margin-top:10px;
    border-radius:14px;
    background:white;
    color:var(--pink);
    border:1px solid #f2c2d8;
    font-weight:800;
}

/* ================= REFERRAL ================= */

.ref-card{
    background:linear-gradient(135deg,#e2136e,#f43b87);
    color:white;
    border-radius:21px;
    padding:20px;
    box-shadow:0 10px 25px rgba(226,19,110,.20);
}

.ref-title{
    font-size:14px;
    font-weight:800;
    opacity:.9;
}

.ref-code{
    font-size:24px;
    font-weight:900;
    margin:6px 0 15px;
    letter-spacing:1px;
}

.ref-link{
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.25);
    padding:11px;
    border-radius:11px;
    font-size:11px;
    word-break:break-all;
}

.ref-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:11px;
}

.ref-buttons button{
    height:43px;
    border-radius:12px;
    background:white;
    color:var(--pink);
    font-weight:900;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-top:12px;
}

.stat{
    background:white;
    border-radius:15px;
    padding:14px 7px;
    text-align:center;
}

.stat b{
    display:block;
    color:var(--pink);
    font-size:18px;
}

.stat span{
    font-size:9px;
    color:#888;
}

/* ================= LIST ================= */

.list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.list-item{
    background:white;
    border-radius:16px;
    padding:13px;
    display:flex;
    align-items:center;
    gap:11px;
    border:1px solid #eee;
}

.list-icon{
    width:43px;
    height:43px;
    border-radius:13px;
    background:#fff0f6;
    object-fit:cover;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    flex-shrink:0;
}

.list-info{
    flex:1;
    min-width:0;
}

.list-info b{
    display:block;
    font-size:13px;
}

.list-info span{
    display:block;
    font-size:10px;
    color:#888;
    margin-top:4px;
}

.small-btn{
    background:var(--pink);
    color:white;
    border-radius:10px;
    padding:9px 12px;
    font-size:10px;
    font-weight:800;
}

/* ================= SPIN ================= */

.spin-area{
    background:white;
    border-radius:22px;
    padding:22px 15px;
    text-align:center;
}

.wheel-wrap{
    width:275px;
    height:275px;
    margin:5px auto 20px;
    position:relative;
}

.wheel{
    width:275px;
    height:275px;
    border-radius:50%;
    border:9px solid white;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
    background:
      conic-gradient(
        #e2136e 0deg 45deg,
        #ff9ac2 45deg 90deg,
        #e2136e 90deg 135deg,
        #ff9ac2 135deg 180deg,
        #e2136e 180deg 225deg,
        #ff9ac2 225deg 270deg,
        #e2136e 270deg 315deg,
        #ff9ac2 315deg 360deg
      );
    transition:transform 4s cubic-bezier(.12,.75,.17,1);
    display:flex;
    align-items:center;
    justify-content:center;
}

.wheel-center{
    width:75px;
    height:75px;
    border-radius:50%;
    background:white;
    color:var(--pink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:13px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.wheel-label{
    position:absolute;
    left:50%;
    top:50%;
    transform-origin:0 0;
    color:white;
    font-size:12px;
    font-weight:900;
    text-shadow:0 1px 3px rgba(0,0,0,.35);
}
.l1{transform:rotate(-75deg) translate(92px)}
.l2{transform:rotate(-20deg) translate(92px)}
.l3{transform:rotate(35deg) translate(92px)}
.l4{transform:rotate(90deg) translate(92px)}
.l5{transform:rotate(145deg) translate(92px)}
.l6{transform:rotate(200deg) translate(92px)}

.pointer{
    position:absolute;
    top:-8px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:12px solid transparent;
    border-right:12px solid transparent;
    border-top:25px solid #222;
    z-index:3;
}

.spin-note{
    font-size:12px;
    color:#888;
    line-height:1.6;
}

/* ================= MINING ================= */

.mining-card{
    background:linear-gradient(135deg,#21152a,#e2136e);
    border-radius:23px;
    padding:22px;
    color:white;
    box-shadow:0 12px 30px rgba(226,19,110,.22);
}

.mining-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.mining-title{
    font-size:21px;
    font-weight:900;
}

.mining-icon{
    width:55px;
    height:55px;
    border-radius:18px;
    background:rgba(255,255,255,.13);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
}

.mining-amount{
    font-size:34px;
    font-weight:900;
    margin:20px 0 3px;
}

.mining-sub{
    opacity:.75;
    font-size:11px;
}

.mining-progress{
    margin-top:17px;
    height:9px;
    background:rgba(255,255,255,.15);
    border-radius:20px;
    overflow:hidden;
}

.mining-progress div{
    height:100%;
    width:0%;
    background:white;
    border-radius:20px;
    transition:.5s;
}

.mining-btn{
    width:100%;
    height:48px;
    background:white;
    color:var(--pink);
    border-radius:14px;
    margin-top:17px;
    font-weight:900;
}

.mining-tier{
    margin-top:15px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.tier{
    background:rgba(255,255,255,.1);
    border-radius:11px;
    padding:10px 5px;
    text-align:center;
    font-size:9px;
}

.tier b{
    display:block;
    font-size:12px;
    margin-bottom:2px;
}

/* ================= NOTICE ================= */

.notice{
    background:white;
    border-radius:17px;
    padding:15px;
    border-left:4px solid var(--pink);
}

.notice b{
    display:block;
    font-size:14px;
}

.notice p{
    color:#666;
    font-size:12px;
    line-height:1.6;
    margin-top:7px;
}

.notice small{
    display:block;
    color:#aaa;
    margin-top:9px;
}

/* ================= LOADING ================= */

.loading{
    position:fixed;
    inset:0;
    z-index:999;
    background:#e2136e;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.loader-logo{
    width:75px;
    height:75px;
    border-radius:23px;
    background:white;
    color:var(--pink);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.loader-logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:7px;
    display:none;
}

#loaderLogoFallback{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:900;
}

.loader-text{
    margin-top:16px;
    font-size:14px;
    font-weight:800;
}

.spinner{
    width:27px;
    height:27px;
    border:3px solid rgba(255,255,255,.3);
    border-top-color:white;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-top:15px;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    z-index:1000;
    left:50%;
    bottom:85px;
    transform:translateX(-50%) translateY(20px);
    background:#222;
    color:white;
    padding:12px 17px;
    border-radius:12px;
    font-size:12px;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    padding:30px 15px;
    color:#999;
    font-size:12px;
}

@media(max-width:360px){
    .grid{
        gap:7px;
    }

    .service-icon{
        width:43px;
        height:43px;
    }

    .service-name{
        font-size:10px;
    }
}
</style>
</head>

<body>

<div id="loading" class="loading">
    <div class="loader-logo">
        <img id="loaderLogo" src="" alt="Logo">
        <div id="loaderLogoFallback">৳</div>
    </div>
    <div id="loaderText" class="loader-text">Loading...</div>
    <div class="spinner"></div>
</div>

<div class="app">

    <!-- HEADER -->
    <header class="header">
        <div class="topbar">

            <div class="profile">
                <img id="userPhoto"
                     class="avatar"
                     src="https://ui-avatars.com/api/?name=User&background=e2136e&color=fff">

                <div class="profile-info">
                    <div id="userName" class="profile-name">Loading...</div>
                    <div id="userUsername" class="profile-user">@telegram</div>
                </div>
            </div>

            <button class="menu-btn" onclick="openSettingsMenu()">☰</button>

        </div>
    </header>

    <!-- BALANCE -->
    <div class="balance-card">

        <div>
            <div class="balance-label">AVAILABLE BALANCE</div>
            <div class="balance">৳ <span id="balance">0.00</span></div>
        </div>

        <button class="withdraw-mini" onclick="openPage('withdraw')">
            Withdraw
        </button>

    </div>

    <!-- CONTENT -->
    <main class="content">

        <div class="section-title">Quick Services</div>

        <!-- FIRST 4 -->
        <div class="grid">

            <button class="service" onclick="openPage('withdraw')">
                <div class="service-icon">💸</div>
                <div class="service-name">Withdraw</div>
            </button>

            <button class="service" onclick="openPage('refer')">
                <div class="service-icon">👥</div>
                <div class="service-name">Refer</div>
            </button>

            <button class="service" onclick="openPage('task')">
                <div class="service-icon">🎯</div>
                <div class="service-name">Task</div>
            </button>

            <button class="service" onclick="openPage('bonus')">
                <div class="service-icon">🎁</div>
                <div class="service-name">Bonus</div>
            </button>

        </div>

        <!-- BANNER -->
        <div id="bannerBox" class="banner-box">
            <div class="banner-placeholder">
                Welcome 💗
            </div>
        </div>

        <!-- SECOND 4 -->
        <div class="grid">

            <button class="service" onclick="openPage('spin')">
                <div class="service-icon">🎡</div>
                <div class="service-name">Spin</div>
            </button>

            <button class="service" onclick="openPage('support')">
                <div class="service-icon">🆘</div>
                <div class="service-name">Support</div>
            </button>

            <button class="service" onclick="openPage('official')">
                <div class="service-icon">📢</div>
                <div class="service-name">Official</div>
            </button>

            <button class="service" onclick="openPage('notice')">
                <div class="service-icon">🔔</div>
                <div class="service-name">Notice</div>
            </button>

        </div>

        <button class="quick-card" style="width:100%;margin-top:10px;text-align:left;border:0" onclick="openTutorial()">
            <div class="quick-icon">🎬</div>
            <div class="quick-text"><b>Tutorial</b><span>Watch the admin-set tutorial video</span></div>
            <div style="margin-left:auto;font-size:22px">›</div>
        </button>

        <!-- MINING -->
        <div style="margin-top:20px">

            <div class="section-title">Mining</div>

            <button
                onclick="openPage('mining')"
                style="
                width:100%;
                text-align:left;
                background:linear-gradient(135deg,#e2136e,#ff5599);
                color:white;
                padding:18px;
                border-radius:20px;
                box-shadow:0 8px 25px rgba(226,19,110,.18);
                ">

                <div style="display:flex;align-items:center;gap:13px">

                    <div style="
                    width:50px;
                    height:50px;
                    border-radius:16px;
                    background:rgba(255,255,255,.15);
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:25px">
                        ⛏️
                    </div>

                    <div>
                        <b style="font-size:16px">Daily Mining</b>
                        <div style="font-size:11px;opacity:.8;margin-top:4px">
                            Mine every 24 hours & earn
                        </div>
                    </div>

                    <div style="margin-left:auto;font-size:22px">›</div>

                </div>

            </button>

        </div>

    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">

/* =========================================================

function escapeHtml(value){

    if(value === null || value === undefined) return "";

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function money(value){

    return n.toLocaleString("en-US",{
        minimumFractionDigits:2,
        maximumFractionDigits:2

function formatDate(timestamp){

    if(!timestamp) return "";

    const d = new Date(timestamp);

    return d.toLocaleString("en-GB",{
        day:"2-digit",
        month:"short",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
    });

}


function todayKey(){

/* =========================================================

========================================================= */

function createReferralCode(id){

    return "REF" +
        String(id)
        .replace(/\D/g,"")
        .slice(-8);

}


/* =========================================================
   GET START PARAM
========================================================= */

function getStartParam(){

    try{

        if(tg &&
           tg.initDataUnsafe &&
           tg.initDataUnsafe.start_param){

            return tg.initDataUnsafe.start_param;

        }

    }catch(e){}

    const params =
        new URLSearchParams(window.location.search);

    return params.get("ref") || "";

}


/* =========================================================
   PROCESS REFERRAL
========================================================= */

async function processReferral(){

    const param = getStartParam();

    if(!param) return;

    let refCode = param;

    if(refCode.startsWith("ref_")){

        refCode = refCode.substring(4);

    }

    if(!refCode) return;

    if(userData.referredBy) return;

    /*
       Find referrer.
       Because referralCode is stored under users,
       this is a simple scan.
       For a very large app, use a dedicated
       referralCodes/{code} -> telegramId index.
    */

    const usersSnap =
        await db.ref("users")
        .orderByChild("referralCode")
        .equalTo(refCode)
        .once("value");

    if(!usersSnap.exists()) return;

    let referrerId = null;

    usersSnap.forEach(child=>{

        referrerId = child.key;

    });

    if(!referrerId) return;

    if(String(referrerId) === String(currentUser.id)){

        return;

    }

    const minRefer =
        Number(settings.minRefer || 0);

    /*
       Register referral.
       Actual cash reward can be controlled
       from server/admin rules later.
    */

    const referralData = {

        referrerId:String(referrerId),

        referredId:String(currentUser.id),

        referredName:
            currentUser.first_name || "",

        referredUsername:
            currentUser.username || "",

        createdAt:
            firebase.database.ServerValue.TIMESTAMP

    };

    await db.ref(
        "referrals/"+referrerId+"/"+currentUser.id
    ).set(referralData);

    await userRef.update({

        referredBy:String(referrerId)

    });

    const refUserRef =
        db.ref("users/"+referrerId);

    const refSnap =
        await refUserRef.once("value");

    const refUser =
        refSnap.val() || {};

    await refUserRef.update({

        totalReferrals:
            Number(refUser.totalReferrals || 0)+1

    });

    /*
       If Admin config has referral reward,
       record it.

       Balance modification should ideally be
       performed server-side in production.
    */

    const reward =
        Number(settings.referralReward || 0);

    if(reward > 0){

        await db.ref(
            "referralRewards/"+referrerId+"/"+currentUser.id
        ).set({

            amount:reward,

            createdAt:
                firebase.database.ServerValue.TIMESTAMP,

            status:"pending"

        });

    }

}

/* =========================================================
   SUBMIT WITHDRAW
========================================================= */

async function submitWithdraw(){

    const amount =
        Number(
            document.getElementById("withdrawAmount").value
        );

    const number =
        document.getElementById("withdrawNumber")
        .value.trim();

    const method =
        document.getElementById("withdrawMethod")
        .value;

    const minWithdraw =
        Number(settings.minWithdraw || 0);

    const minRefer =
        Number(settings.minRefer || 0);

    const balance =
        Number(userData.balance || 0);

    const referrals =
        Number(userData.totalReferrals || 0);

    if(!method){

        showToast("Select withdraw method");

        return;

    }

    if(!amount || amount <= 0){

        showToast("Enter valid amount");

        return;

    }

    if(amount < minWithdraw){

        showToast(
            "Minimum withdraw ৳"+minWithdraw
        );

        return;

    }

    if(referrals < minRefer){

        showToast(
            "You need at least "+minRefer+" referrals"
        );

        return;

    }

    if(amount > balance){

        showToast("Insufficient balance");

        return;

    }

    if(!number){

        showToast("Enter account number");

        return;

    }

    const requestId =
        db.ref("withdrawals").push().key;

    await db.ref(
        "withdrawals/"+requestId
    ).set({

        id:requestId,

        userId:String(currentUser.id),

        userName:
            [
                currentUser.first_name || "",
                currentUser.last_name || ""
            ].join(" ").trim(),

        username:
            currentUser.username || "",

        amount:amount,

        methodId:method,

        accountNumber:number,

        status:"pending",

        createdAt:
            firebase.database.ServerValue.TIMESTAMP

    });

    /*
       IMPORTANT:
       Do NOT deduct balance from client in a
       production money system.

       Admin/server should approve and atomically
       deduct balance.

       Here we only create request.
    */

    showToast("Withdraw request submitted");

    closeModal();

}

async function openTasks(){
    const snap = await db.ref("tasks").once("value");

    const claims = claimsSnap.val() || {};
    let html = "";

    snap.forEach(child=>{
        const task = child.val() || {};
        if(task.status===false || task.status==="inactive") return;
        const claimed = claims[child.key] && (claims[child.key].status==="completed" || claims[child.key].status==="approved" || claims[child.key].status==="pending");
        const image = task.image || task.imageUrl || task.logo || "";

        </div>`;
    });

    if(!html) html = `<div class="empty">No active tasks available.</div>`;
    openModal("Tasks",`

}

async function openTask(link,id,reward){
    if(!id) return;
    const existing = await db.ref("taskClaims/"+currentUser.id+"/"+id).once("value");
    if(existing.exists() && ["pending","completed","approved"].includes(String(existing.val().status))){
        showToast("This task is already submitted");
        return;
    }
    if(link) openExternal(link);
    await db.ref("taskClaims/"+currentUser.id+"/"+id).set({taskId:id,reward:Number(reward||0),status:"started",createdAt:firebase.database.ServerValue.TIMESTAMP});
    showToast("Task opened. Complete it, then wait for verification.");
}

function getSpinRange(){
    const min = Math.max(1, Number(settingValue("spinMin","minSpinReward") || 50));
    const max = Math.max(min, Number(settingValue("spinMax","maxSpinReward") || 150));
    return {min,max};
}

async function openSpin(){
    const today = todayKey();
    const snap = await db.ref("spinClaims/"+currentUser.id+"/"+today).once("value");
    const claimed = snap.exists();
    const range = getSpinRange();

    openModal("Daily Spin",`
        <div class="spin-area">
            <div style="font-size:12px;color:#777;margin-bottom:12px">Spin once every 24 hours and win from <b>৳${range.min}</b> to <b>৳${range.max}</b>.</div>
            <div class="wheel-wrap">
                <div class="pointer"></div>
                <div id="wheel" class="wheel">
                    <span class="wheel-label l1">৳10</span><span class="wheel-label l2">৳100</span><span class="wheel-label l3">৳250</span><span class="wheel-label l4">৳500</span><span class="wheel-label l5">৳750</span><span class="wheel-label l6">৳1000</span>

}

async function doSpin(){
    const today = todayKey();
    const claimRef = db.ref("spinClaims/"+currentUser.id+"/"+today);
    const snap = await claimRef.once("value");
    if(snap.exists()){
        showToast("You already spun today");
        return;
    }

    const button = document.getElementById("spinButton");
    if(!button) return;
    button.disabled = true;

    const range = getSpinRange();
    const reward = Math.floor(Math.random()*(range.max-range.min+1))+range.min;
    spinRotation += 1440 + Math.floor(Math.random()*360);
    const wheel = document.getElementById("wheel");
    if(wheel) wheel.style.transform = "rotate("+spinRotation+"deg)";

    setTimeout(async()=>{
        const again = await claimRef.once("value");
        if(again.exists()) return;
        const key = db.ref("rewardClaims").push().key;
        await claimRef.set({reward, status:"pending", claimId:key, createdAt:firebase.database.ServerValue.TIMESTAMP});
        await db.ref("rewardClaims/"+key).set({type:"spin", userId:String(currentUser.id), amount:reward, status:"pending", createdAt:firebase.database.ServerValue.TIMESTAMP});
        showToast("You won ৳"+money(reward)+"! Claim sent for processing.");
    },4200);
}

/* =========================================================
   MINING
========================================================= */

function getMiningTier(refs){
    const tiers = [
        {min:0,  max:2,  low:30,  high:40, label:"0-2"},
        {min:3,  max:5,  low:50,  high:50, label:"3-5"},
        {min:6,  max:9,  low:70,  high:70, label:"6-9"},
        {min:10, max:999999, low:100, high:120, label:"10+"}
    ];
    return tiers.find(t=>refs>=t.min && refs<=t.max) || tiers[0];
}

function miningReward(refs){
    const tier = getMiningTier(refs);
    return Math.floor(Math.random()*(tier.high-tier.low+1))+tier.low;
}

async function getMiningState(){
    const snap = await db.ref("mining/"+currentUser.id).once("value");
    return snap.val() || {};
}

function miningProgress(lastStart){
    if(!lastStart) return 100;
    return Math.min(100, Math.max(0, ((Date.now()-Number(lastStart))/(24*60*60*1000))*100));
}

async function openMining(){
    const mining = await getMiningState();
    const refs = Number(userData.totalReferrals || 0);
    const tier = getMiningTier(refs);
    const lastStart = Number(mining.lastStart || 0);
    const readyToClaim = lastStart && Date.now()-lastStart >= 24*60*60*1000;
    const active = lastStart && !readyToClaim;
    const progress = miningProgress(lastStart);

    let action = "";
    if(readyToClaim){
        action = `<button class="mining-btn" onclick="claimMining()">💰 CLAIM ৳${money(mining.reward || 0)}</button>`;
    }else if(active){
        action = `<button id="mineButton" class="mining-btn" disabled>⏳ Mining in progress</button>`;
    }else{
        action = `<button id="mineButton" class="mining-btn" onclick="startMining()">⛏ START 24H MINING</button>`;
    }

    openModal("Daily Mining",`
        <div class="mining-card">
            <div class="mining-top">
                <div>
                    <div class="mining-title">⛏️ Daily Mining</div>
                    <div style="font-size:10px;opacity:.72;margin-top:4px">Your referral count controls mining speed</div>
                </div>
                <div class="mining-icon">💎</div>
            </div>
            <div class="mining-amount">৳${tier.low}${tier.low!==tier.high?"-"+tier.high:""}</div>
            <div class="mining-sub">Estimated reward for the current 24-hour cycle</div>
            <div class="mining-progress"><div style="width:${progress}%"></div></div>
            ${action}
            <div class="mining-tier">
                <div class="tier"><b>0-2 Refer</b>৳30-40</div>
                <div class="tier"><b>3-5 Refer</b>৳50</div>
                <div class="tier"><b>6-9 Refer</b>৳70</div>
            </div>
            <div style="margin-top:8px;background:rgba(255,255,255,.1);border-radius:11px;padding:10px;text-align:center;font-size:10px">10+ referrals → <b>৳100-120/day</b></div>
        </div>
        <div style="margin-top:12px;background:white;border-radius:16px;padding:15px">
            <b style="font-size:14px">Your Mining Level</b>
            <div style="font-size:12px;color:#777;margin-top:6px">${refs} referral(s) • Current rate ৳${tier.low}${tier.low!==tier.high?"-"+tier.high:""}/24h</div>
        </div>
        <div style="margin-top:10px;background:#fff5f9;border-radius:14px;padding:12px;font-size:11px;color:#777;line-height:1.6">
            Start mining once, wait 24 hours, then come back and claim your reward. More verified referrals increase your daily rate.
        </div>
    `);
}

async function startMining(){
    const miningRef = db.ref("mining/"+currentUser.id);
    const snap = await miningRef.once("value");
    const mining = snap.val() || {};
    const now = Date.now();
    const lastStart = Number(mining.lastStart || 0);

    if(lastStart && now-lastStart < 24*60*60*1000){
        showToast("Mining is already running");
        return;
    }

    const refs = Number(userData.totalReferrals || 0);
    const reward = miningReward(refs);

    await miningRef.set({
        lastStart: now,
        reward: reward,
        status: "mining",
        referralCount: refs,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
    });

    showToast("Mining started for 24 hours");
    setTimeout(openMining,500);
}

async function claimMining(){
    const miningRef = db.ref("mining/"+currentUser.id);
    const snap = await miningRef.once("value");
    const mining = snap.val() || {};
    const lastStart = Number(mining.lastStart || 0);
    const reward = Number(mining.reward || 0);

    if(!lastStart || Date.now()-lastStart < 24*60*60*1000){
        showToast("Your mining cycle is not complete yet");
        return;
    }
    if(!reward){
        showToast("No mining reward available");
        return;
    }

    const claimKey = db.ref("rewardClaims").push().key;
    await db.ref("rewardClaims/"+claimKey).set({
        type:"mining",
        userId:String(currentUser.id),
        amount:reward,
        source:"daily_mining",
        status:"pending",
        createdAt:firebase.database.ServerValue.TIMESTAMP
    });

    await miningRef.update({
        lastClaim: firebase.database.ServerValue.TIMESTAMP,
        status:"claimed"
    });

    showToast("Mining claim submitted: ৳"+money(reward));
    setTimeout(openMining,500);
}

/* =========================================================
   BANNER
========================================================= */

async function loadBanner(){

    try{

        const snap =
            await db.ref("banners").once("value");

        let banners = [];

        snap.forEach(child=>{

            const b =
                child.val() || {};

            if(
                b.status === false ||
                b.status === "inactive"
            ){

                return;

            }

            banners.push(b);

        });

        banners.sort(
            (a,b)=>
            Number(a.order || 0)-
            Number(b.order || 0)
        );

        const box =
            document.getElementById("bannerBox");

        if(!banners.length){

            box.innerHTML = `
                <div class="banner-placeholder">
                    ${escapeHtml(
                        getBotName()
                    )}
                </div>
            `;

            return;

        }

        let index = 0;

        function render(){

            const banner =
                banners[index];

            const image =
                banner.image ||
                banner.imageUrl ||
                "";

            if(image){

                box.innerHTML = `

                    <img
                        class="banner"
                        src="${escapeHtml(image)}"
                        alt="Banner"
                        onclick="${
                            banner.url
                            ? `openExternal('${escapeHtml(banner.url)}')`
                            : ""
                        }">

                `;

            }else{

                box.innerHTML = `

                    <div class="banner-placeholder">

                        ${escapeHtml(
                            banner.title ||
                            getBotName()
                        )}

                    </div>

                `;

            }

        }

        render();

        if(banners.length > 1){

            setInterval(()=>{

                index =
                    (index+1)%banners.length;

                render();

            },5000);

        }

    }catch(error){

        console.error("Banner:",error);

    }

}
