.wheel{width:280px;height:280px;border-radius:50%;border:8px solid #fff;outline:4px solid var(--p);box-shadow:0 6px 24px rgba(226,19,110,.3);transition:transform 4.5s cubic-bezier(.12,.75,.17,1);position:relative;background:conic-gradient(#e91e63 0 45deg,#9c27b0 45deg 90deg,#3f51b5 90deg 135deg,#009688 135deg 180deg,#ff9800 180deg 225deg,#4caf50 225deg 270deg,#00bcd4 270deg 315deg,#f44336 315deg 360deg)}
.wl{position:absolute;left:50%;top:50%;width:0;height:0}

function getStartParam(){
  try{
    if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param){
      return String(tg.initDataUnsafe.start_param).trim();
    }
  }catch(e){}
  const p=new URLSearchParams(window.location.search);
  return String(p.get("tgWebAppStartParam")||p.get("startapp")||p.get("ref")||"").trim();
}

async function processReferral(){
  let c=getStartParam();
  if(!c||userData.referredBy)return;
  if(c.startsWith("ref_"))c=c.substring(4);
  if(c.startsWith("REF"))c=c.substring(3);
  const rid=String(c).trim();

  if(!/^\d+$/.test(rid)||rid===String(currentUser.id))return;

  const refSnap=await db.ref("users/"+rid).once("value");
  if(!refSnap.exists())return;

  const tx=await db.ref("referrals/"+rid+"/"+currentUser.id).transaction(cur=>{
    if(cur)return;
    return{
      referrerId:rid,
      referredId:String(currentUser.id),
      referredName:[currentUser.first_name||"",currentUser.last_name||""].join(" ").trim()||"Telegram User",
      referredUsername:currentUser.username||"",
      createdAt:Date.now()
    };
  });

  await userRef.update({referredBy:rid});
  userData.referredBy=rid;

  if(!tx.committed)return;

  const reward=Number(settings.referralReward!==undefined?settings.referralReward:10);
  const rref=db.ref("users/"+rid);
  
  await rref.child("totalReferrals").transaction(v=>Number(v||0)+1);
  if(reward>0){
    await rref.child("balance").transaction(v=>Number(v||0)+reward);
    await rref.child("referralEarnings").transaction(v=>Number(v||0)+reward);
    await db.ref("referralRewards/"+rid+"/"+currentUser.id).set({amount:reward,createdAt:TS,status:"paid"});
  }
}

  <button class="pbtn" id="wBtn" onclick="submitWithdraw()">উইথড্র দিন</button>`);

function pickMethod(id){
  id=String(id||"").toLowerCase();
  if(id!=="bkash"&&id!=="nagad")return;
  wSel=id;
  document.querySelectorAll(".method").forEach(b=>b.classList.toggle("sel",b.dataset.id===id));

async function submitWithdraw(){
  const amount=Number(document.getElementById("withdrawAmount").value);
  const number=document.getElementById("withdrawNumber").value.trim();
  const minW=Number(settings.minWithdraw||0),minR=Number(settings.minRefer||0);
  const bal=Number(userData.balance||0),refs=Number(userData.totalReferrals||0);
  const err=m=>showPopup("Failed",m,null,true);
  if(wSel!=="bkash"&&wSel!=="nagad")return err("উইথড্র মেথড সিলেক্ট করুন");
  if(!amount||amount<=0)return err("সঠিক টাকার পরিমাণ দিন");
  if(amount<minW)return err("সর্বনিম্ন উইথড্র ৳"+minW);
  if(refs<minR)return err("আপনার অন্তত "+minR+" টি রেফারেল প্রয়োজন");
  if(amount>bal)return err("পর্যাপ্ত ব্যালেন্স নেই");
  if(!number)return err("অ্যাকাউন্ট নাম্বার দিন");
  if(!/^01\d{9}$/.test(number))return err("সঠিক ১১ ডিজিটের নাম্বার দিন");
  const btn=document.getElementById("wBtn");if(btn)btn.disabled=true;
  
  const tx=await userRef.child("balance").transaction(v=>v===null?v:(Number(v)>=amount?Number(v)-amount:undefined));
  if(!tx.committed||tx.snapshot.val()===null){if(btn)btn.disabled=false;return err("পর্যাপ্ত ব্যালেন্স নেই")}
  const method=wMethods.find(x=>x.id===wSel);
  const id=db.ref("withdrawals").push().key;
  await db.ref("withdrawals/"+id).set({id,userId:String(currentUser.id),userName:[currentUser.first_name||"",currentUser.last_name||""].join(" ").trim(),username:currentUser.username||"",amount,methodId:method.id,methodName:method.name,accountNumber:number,status:"pending",balanceDeducted:true,createdAt:TS});
  closeModal();
  showPopup("Request Submitted!",method.name+" উইথড্র রিকোয়েস্ট সফলভাবে সাবমিট হয়েছে। এটি প্রসেসিং এ আছে।",amount);
}

}

const TASK_WAIT=10000;
function taskLeft(c){
  if(!c||!["completed","approved","pending"].includes(String(c.status)))return 0;
  const left=Number(c.completedAt||c.createdAt||0)+DAY-Date.now();
  return left>0?left:0;
}
async function openTasks(){
  const [snap,cs]=await Promise.all([db.ref("tasks").once("value"),db.ref("taskClaims/"+currentUser.id).once("value")]);
  const claims=cs.val()||{};
  let h="";
  snap.forEach(ch=>{
    const t=ch.val()||{};
    if(t.status===false||t.status==="inactive")return;
    const c=claims[ch.key];
    const left=taskLeft(c);
    const started=!left&&c&&c.status==="started";

async function claimTask(id){

  const wait=TASK_WAIT-(Date.now()-Number(t.startedAt||0));

function getMiningTier(r){return[{min:0,max:2,low:30,high:40},{min:3,max:5,low:50,high:50},{min:6,max:9,low:70,high:70},{min:10,max:999999,low:100,high:120}].find(t=>r>=t.min&&r<=t.max)}
const miningReward=r=>{const t=getMiningTier(r);return Math.floor(Math.random()*(t.high-t.low+1))+t.low};
const miningProgress=l=>!l?0:Math.min(100,Math.max(0,(Date.now()-Number(l))/DAY*100));

  const m=(await db.ref("mining/"+currentUser.id).once("value")).val()||{};

  const act=ready?`<button class="mbtn" onclick="claimMining()">💰 ক্লেইম করুন ৳${money(m.reward||0)}</button>`:active?`<button class="mbtn" disabled>⏳ মাইনিং চলছে</button>`:`<button class="mbtn" onclick="startMining()">⛏ ২৪ ঘণ্টার মাইনিং শুরু করুন</button>`;

    const n=ch.val()||{};
    if(n.status===false||n.status==="inactive")return;
    h+=`<div class="card" style="border-left:4px solid var(--p)"><b style="font-size:14px">${esc(n.title||"নোটিশ")}</b><p style="color:#666;font-size:12px;line-height:1.6;margin-top:7px">${esc(n.text||n.description||"")}</p><small style="display:block;color:#aaa;margin-top:9px">${formatDate(n.date||n.createdAt)}</small></div>`;
  });
  openModal("Notice",`<div class="list">${h||'<div class="empty">কোনো নোটিশ নেই।</div>'}</div>`);
}
function openTutorial(){
  const u=getTutorialUrl();
  if(!u)return showPopup("Not Available","টিউটোরিয়াল সেট আপ করা নেই।",null,true);
  openModal("Tutorial",`<div class="card" style="text-align:center;padding:20px"><img src="https://i.ibb.co/TMYGBPSG/6204174559833954130-121.jpg" alt="Tutorial" style="width:96px;height:96px;border-radius:22px;object-fit:cover;border:2px solid #f7c3da;box-shadow:0 8px 20px rgba(226,19,110,.15)"><h2 style="font-size:21px;font-weight:900;margin-top:14px">টিউটোরিয়াল</h2><p style="font-size:14px;font-weight:700;color:#777;line-height:1.7;margin-top:8px">অ্যাপটি কীভাবে ব্যবহার করতে হয় তা শিখতে টিউটোরিয়াল ভিডিওটি দেখুন।</p><button class="pbtn" onclick="openExternal('${esc(u)}')">🎬 টিউটোরিয়াল দেখুন</button></div>`);
}

/* ===== SETTINGS MENU ===== */
function openSettingsMenu(){
  const it=(i,t,s,f)=>`<button class="row" style="margin:0" onclick="${f}"><div class="ric">${i}</div><div><b>${t}</b><span class="s">${s}</span></div><div class="arrow">›</div></button>`;
  openModal(getBotName(),`<div class="list">
    ${it(`<img class="tutorial-logo" src="https://i.ibb.co/TMYGBPSG/6204174559833954130-121.jpg" alt="Tutorial">`,"টিউটোরিয়াল","অ্যাপটি কীভাবে ব্যবহার করতে হয় তা শিখুন","openTutorial()")}
    ${it("🧾","উইথড্র হিস্ট্রি","আপনার উইথড্র হিস্ট্রি দেখুন","openWithdrawHistory()")}
    ${it("🔔","নোটিশ","সর্বশেষ আপডেটগুলো দেখুন","openNotice()")}
    ${it("📢","পেমেন্ট গ্রুপ","আমাদের পেমেন্ট গ্রুপে জয়েন করুন","openOfficial()")}
    ${it("🎧","সাপোর্ট","সাপোর্টে যোগাযোগ করুন","openSupport()")}
  </div>`);
}

/* ===== PAGE ROUTER ===== */
async function openPage(p){
  try{
    const m={withdraw:openWithdraw,refer:openRefer,task:openTasks,bonus:openBonus,spin:openSpin,ads:openAds,mining:openMining,support:openSupport,official:openOfficial,notice:openNotice,tutorial:openTutorial};
    if(m[p])await m[p]();
  }catch(e){console.error(e);showPopup("Oops","Something went wrong: "+(e&&e.message?e.message:""),null,true)}
}

/* ===== LINKS ===== */
function openTelegram(u){
  if(!u)return showPopup("Not Available","Support is not configured.",null,true);
  const url=/^https?:\/\//i.test(u)?u:"https://t.me/"+u;
  if(tg&&tg.openTelegramLink&&url.includes("t.me/"))tg.openTelegramLink(url);else window.open(url,"_blank");
}
function openExternal(u){
  if(!u)return showPopup("Not Available","Link not configured.",null,true);
  if(tg&&tg.openLink)tg.openLink(u);else window.open(u,"_blank");
}

/* ===== BANNER ===== */
function loadBanner(){
  const box=document.getElementById("bannerBox");if(!box)return;
  const bannerUrl="https://i.ibb.co/GfL8xMpN/Tkpay-Free-Earning-Bot-Banner.png";
  box.innerHTML=`<a href="${bannerUrl}" target="_blank" rel="noopener" style="display:block;line-height:0"><img class="banner" src="${bannerUrl}" alt="TK Pay Free Earning Bot Banner"></a>`;
}

/* ===== START ===== */
async function startApp(){
  try{
    initTelegram();
    const L=document.getElementById("loaderText");
    L.innerText="Loading settings...";await loadSettings();
    L.innerText="Loading account...";await initializeUser();
    listenUser();loadBanner();loadMonetag();loadRecentWithdrawActivity();
    document.getElementById("loading").style.display="none";
  }catch(e){
    console.error(e);
    document.getElementById("loaderText").innerText="Failed to load";
    showToast(e.message||"Application failed to start");
  }
}
startApp();

</script>
