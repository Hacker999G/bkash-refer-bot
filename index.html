function getStartParam(){try{if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)return tg.initDataUnsafe.start_param}catch(e){}return new URLSearchParams(location.search).get("ref")||""}
async function processReferral(){
  let c=String(getStartParam()||"").trim();
  if(!c||userData.referredBy)return;
  if(c.startsWith("ref_"))c=c.substring(4);
  if(c.startsWith("REF"))c=c.substring(3);
  const rid=String(c);
  if(!/^\d+$/.test(rid)||rid===String(currentUser.id))return;
  const refSnap=await db.ref("users/"+rid).once("value");
  if(!refSnap.exists())return;
  const oldRef=await db.ref("referrals/"+rid+"/"+currentUser.id).once("value");
  if(oldRef.exists()){await userRef.update({referredBy:rid});return;}
  await db.ref("referrals/"+rid+"/"+currentUser.id).set({referrerId:rid,referredId:String(currentUser.id),referredName:[currentUser.first_name||"",currentUser.last_name||""].join(" ").trim(),referredUsername:currentUser.username||"",createdAt:TS});
  await userRef.update({referredBy:rid});
  const rr=db.ref("users/"+rid),ru=refSnap.val()||{};
  await rr.update({totalReferrals:Number(ru.totalReferrals||0)+1});
  const reward=Number(settings.referralReward||0);
  if(reward>0)await db.ref("referralRewards/"+rid+"/"+currentUser.id).set({amount:reward,createdAt:TS,status:"pending"});
}

const FIXED_WITHDRAW_METHODS=[

];
let wMethods=[...FIXED_WITHDRAW_METHODS],wSel="bkash";

async function openWithdraw(preferred){
  /* Always use fixed bKash/Nagad methods */
  wMethods=[...FIXED_WITHDRAW_METHODS];
  const q=String(preferred||"").toLowerCase();
  wSel=(q==="bkash"||q.includes("bkash")||q.includes("বিকাশ"))?"bkash":
       (q==="nagad"||q.includes("nagad")||q.includes("নগদ"))?"nagad":"bkash";

  const mh=wMethods.map(m=>`<button class="method ${m.id===wSel?"sel":""}" data-id="${m.id}" onclick="pickMethod('${m.id}')"><img src="${m.logo}" alt="${m.name}"><b>${m.name}</b><small style="display:block;color:#888;margin-top:4px">Direct withdraw</small></button>`).join("");

  openModal("Withdraw",`
  <div class="card" style="display:flex;gap:12px;align-items:center"><div class="ric">💰</div><div><b style="font-size:12px;color:#888">Available Balance</b><div style="font-size:22px;font-weight:900;color:var(--p)">৳ ${money(userData.balance||0)}</div></div></div>
  <div class="info">Minimum Withdraw: <b>৳${money(settings.minWithdraw||0)}</b><br>Minimum Referral: <b>${Number(settings.minRefer||0)}</b><br>Your Referral: <b>${Number(userData.totalReferrals||0)}</b></div>
  <label class="label">Withdraw Method</label><div class="methods">${mh}</div>
  <label class="label">Amount</label><input id="withdrawAmount" class="input" type="number" placeholder="Enter amount">
  <label class="label">Account Number</label><input id="withdrawNumber" class="input" type="text" inputmode="numeric" maxlength="11" placeholder="01XXXXXXXXX">
  <button class="pbtn" onclick="submitWithdraw()">Submit Withdraw</button>`);
}

function pickMethod(id){
  id=String(id||"").toLowerCase();
  if(id!=="bkash"&&id!=="nagad")return;
  wSel=id;
  document.querySelectorAll(".method").forEach(b=>b.classList.toggle("sel",b.dataset.id===id));
}

async function submitWithdraw(){
  const amount=Number(document.getElementById("withdrawAmount").value);
  const number=document.getElementById("withdrawNumber").value.trim();
  const minW=Number(settings.minWithdraw||0),minR=Number(settings.minRefer||0);
  const bal=Number(userData.balance||0),refs=Number(userData.totalReferrals||0);
  const err=m=>showPopup("Failed",m,null,true);
  if(wSel!=="bkash"&&wSel!=="nagad")return err("Select withdraw method");
  if(!amount||amount<=0)return err("Enter valid amount");
  if(amount<minW)return err("Minimum withdraw ৳"+minW);
  if(refs<minR)return err("You need at least "+minR+" referrals");
  if(amount>bal)return err("Insufficient balance");
  if(!number)return err("Enter account number");
  if(!/^01\d{9}$/.test(number))return err("Enter a valid 11 digit account number");

  const method=wMethods.find(x=>x.id===wSel);
  const id=db.ref("withdrawals").push().key;
  await db.ref("withdrawals/"+id).set({
    id,
    userId:String(currentUser.id),
    userName:[currentUser.first_name||"",currentUser.last_name||""].join(" ").trim(),
    username:currentUser.username||"",
    amount,
    methodId:method.id,
    methodName:method.name,
    accountNumber:number,
    status:"pending",
    createdAt:TS
  });
  closeModal();
  showPopup("Request Submitted!",method.name+" withdraw request submitted successfully. It is pending processing.",amount);
}

async function openWithdrawHistory(){
  const snap=await db.ref("withdrawals").orderByChild("userId").equalTo(String(currentUser.id)).once("value");
  let arr=[];snap.forEach(c=>arr.push({id:c.key,...c.val()}));
  arr.sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));
  const h=arr.map(w=>{
    const st=String(w.status||"pending"),label=st.charAt(0).toUpperCase()+st.slice(1);
    const cls=["approved","completed","paid","success","successful"].includes(st.toLowerCase())?"color:#16a56b":st.toLowerCase()==="rejected"?"color:#e53935":"color:#f59e0b";
    const mn=String(w.methodName||w.methodId||"Withdraw");
    const icon=mn.toLowerCase().includes("nagad")||mn.includes("নগদ")?"🟠":"💗";
    return `<div class="li"><div class="ric">${icon}</div><div class="in"><b>${esc(mn)} • ৳${money(w.amount)}</b><span>${esc(String(w.accountNumber||"").replace(/.(?=.{4})/g,"•"))} • ${formatDate(w.createdAt)}</span></div><div style="font-size:10px;font-weight:900;${cls}">${esc(label)}</div></div>`;
  }).join("");
  openModal("Withdraw History",`<div class="list">${h||'<div class="empty">No withdrawal history found.</div>'}</div>`);
}

  <div id="spinMsg" style="color:#c8102e;font-size:12px;font-weight:700"></div>
  <div style="font-size:11px;color:#999;margin-top:12px">মোট স্পিন করেছেন: ${Number(st.total||0)} বার</div></div>`);
  const upd=()=>{const left=Number(st.last||0)+DAY-Date.now(),T=document.getElementById("spinTimer");if(!T){clearInterval(tickT);return}
    const ok=left<=0;T.innerText=ok?"✅ এখন স্পিন করুন!":"পরবর্তী স্পিন: "+fmtT(left);
    const m=document.getElementById("spinMsg");if(m)m.innerText=ok?"":"সময় শেষ না হওয়া পর্যন্ত স্পিন করা যাবে না।"};
  upd();tickT=setInterval(upd,1000);
}
async function doSpin(){
  const ref=db.ref("spinState/"+currentUser.id),st=(await ref.once("value")).val()||{};
  if(Date.now()-Number(st.last||0)<DAY)return showPopup("Wait!","সময় শেষ না হওয়া পর্যন্ত স্পিন করা যাবে না।",null,true);
  const btn=document.getElementById("spinBtn");if(btn.disabled)return;btn.disabled=true;
  const idx=Math.floor(Math.random()*WHEEL.length),reward=WHEEL[idx];
  const target=360-(idx*45+22.5);spinRot=Math.ceil(spinRot/360)*360+1800+target;
  document.getElementById("wheel").style.transform="rotate("+spinRot+"deg)";
  await ref.set({last:Date.now(),total:Number(st.total||0)+1});
  setTimeout(async()=>{
    const k=db.ref("rewardClaims").push().key;
    await db.ref("spinClaims/"+currentUser.id+"/"+todayKey()).set({reward,status:"pending",claimId:k,createdAt:TS});
    await db.ref("rewardClaims/"+k).set({type:"spin",userId:String(currentUser.id),amount:reward,status:"pending",createdAt:TS});
    showPopup("অভিনন্দন! 🎉","আপনি স্পিনে জিতেছেন। ব্যালেন্সে যুক্ত হচ্ছে।",reward);openSpin();
  },4700);
}

/* ===== MINING ===== */
function getMiningTier(r){return [{min:0,max:2,low:30,high:40},{min:3,max:5,low:50,high:50},{min:6,max:9,low:70,high:70},{min:10,max:999999,low:100,high:120}].find(t=>r>=t.min&&r<=t.max)}
const miningReward=r=>{const t=getMiningTier(r);return Math.floor(Math.random()*(t.high-t.low+1))+t.low};
const miningProgress=l=>!l?0:Math.min(100,Math.max(0,(Date.now()-Number(l))/DAY*100));
async function openMining(){
  const m=(await db.ref("mining/"+currentUser.id).once("value")).val()||{};
  const refs=Number(userData.totalReferrals||0),tier=getMiningTier(refs),last=Number(m.lastStart||0);
  const ready=last&&m.status==="mining"&&Date.now()-last>=DAY,active=last&&m.status==="mining"&&!ready;
  const pr=ready?100:active?miningProgress(last):0,rate=tier.low+(tier.low!==tier.high?"-"+tier.high:"");
  const act=ready?`<button class="mbtn" onclick="claimMining()">💰 CLAIM ৳${money(m.reward||0)}</button>`:active?`<button class="mbtn" disabled>⏳ Mining in progress</button>`:`<button class="mbtn" onclick="startMining()">⛏ START 24H MINING</button>`;
  openModal("Daily Mining",`<div class="mcard"><div style="font-size:19px;font-weight:900">⛏️ Daily Mining</div><div style="font-size:10px;opacity:.8;margin-top:4px">Your referral count controls mining speed</div>
  <div class="ring" style="background:conic-gradient(#fff ${pr*3.6}deg,rgba(255,255,255,.25) 0)"><div class="ringin"><small>${ready?"Ready to claim":active?"Mining...":"Estimated"}</small><b>${ready?"+৳"+money(m.reward||0):"৳"+rate}</b><small>BDT / 24h</small></div></div>
  <div style="font-size:12px;margin-bottom:12px" id="mt">${active?fmtT(last+DAY-Date.now())+" left":Math.floor(pr)+"%"}</div>${act}
  <div class="tiers"><div class="tier"><b>0-2</b>৳30-40</div><div class="tier"><b>3-5</b>৳50</div><div class="tier"><b>6-9</b>৳70</div><div class="tier"><b>10+</b>৳100-120</div></div></div>
  <div class="card" style="margin-top:12px"><b style="font-size:14px">Your Mining Level</b><div style="font-size:12px;color:#777;margin-top:6px">${refs} referral(s) • Current rate ৳${rate}/24h</div></div>
  <div class="info">Start mining once, wait 24 hours, then claim your reward. More referrals increase your daily rate.</div>`);
  if(active){tickT=setInterval(()=>{const e=document.getElementById("mt");if(!e){clearInterval(tickT);return}const l=last+DAY-Date.now();if(l<=0){clearInterval(tickT);openMining()}else e.innerText=fmtT(l)+" left"},1000)}
}
async function startMining(){
  const ref=db.ref("mining/"+currentUser.id),m=(await ref.once("value")).val()||{},now=Date.now();
  if(m.status==="mining"&&m.lastStart&&now-Number(m.lastStart)<DAY)return showPopup("Already Running","Mining is already running.",null,true);
  const refs=Number(userData.totalReferrals||0);
  await ref.set({lastStart:now,reward:miningReward(refs),status:"mining",referralCount:refs,updatedAt:TS});
  showPopup("Mining Started ⛏️","Come back after 24 hours to claim your reward.");openMining();
}
async function claimMining(){
  const ref=db.ref("mining/"+currentUser.id),m=(await ref.once("value")).val()||{},last=Number(m.lastStart||0),reward=Number(m.reward||0);
  if(m.status!=="mining"||!last||Date.now()-last<DAY)return showPopup("Not Ready","Your mining cycle is not complete yet.",null,true);
  if(!reward)return showPopup("Error","No mining reward available.",null,true);
  const k=db.ref("rewardClaims").push().key;
  await db.ref("rewardClaims/"+k).set({type:"mining",userId:String(currentUser.id),amount:reward,source:"daily_mining",status:"pending",createdAt:TS});
  await ref.update({lastClaim:TS,status:"claimed"});
  showPopup("Mining Reward!","Your mining claim has been submitted.",reward);openMining();
}

/* ===== SUPPORT / OFFICIAL / NOTICE / TUTORIAL ===== */
function infoCard(icon,t,p,btn,fn){return `<div class="card" style="text-align:center;padding:26px"><div style="font-size:56px;animation:bob2 1.6s infinite">${icon}</div><h2 style="margin-top:10px">${t}</h2><p style="color:#888;font-size:12px;margin-top:8px;line-height:1.6">${p}</p><button class="pbtn" onclick="${fn}">${btn}</button></div>`}
function openSupport(){openModal("Support",infoCard("🎧","Need Help?","If you have any problem, contact our official support.","💬 Contact Support",`openTelegram('${esc(getSupportTelegram())}')`))}
function openOfficial(){openModal("Official Channel",infoCard("📢","Official Channel","Follow our official Telegram channel for updates.","📢 Open Channel",`openExternal('${esc(getOfficialChannel())}')`))}
async function openNotice(){
  const snap=await db.ref("notices").once("value");let h="";
  snap.forEach(ch=>{const n=ch.val()||{};if(n.status===false||n.status==="inactive")return;
    h+=`<div class="card" style="border-left:4px solid var(--p)"><b style="font-size:14px">${esc(n.title||"Notice")}</b><p style="color:#666;font-size:12px;line-height:1.6;margin-top:7px">${esc(n.text||n.description||"")}</p><small style="display:block;color:#aaa;margin-top:9px">${formatDate(n.date||n.createdAt)}</small></div>`});
  openModal("Notice",`<div class="list">${h||'<div class="empty">No notices available.</div>'}</div>`);
}
function openTutorial(){const u=getTutorialUrl();if(!u)return showPopup("Not Available","Tutorial not configured.",null,true);openExternal(u)}
function openSettingsMenu(){
  const it=(i,t,s,f)=>`<button class="row" style="margin:0" onclick="${f}"><div class="ric">${i}</div><div><b>${t}</b><span class="s">${s}</span></div><div class="arrow">›</div></button>`;
  openModal(getBotName(),`<div class="list">${it("🎬","Tutorial","Learn how to use the app","openTutorial()")}${it("🧾","Withdraw History","View your withdrawal history","openWithdrawHistory()")}${it("🔔","Notice","Latest announcements","openNotice()")}${it("📢","Official Channel","Join our official channel","openOfficial()")}${it("🎧","Support","Contact support","openSupport()")}</div>`);
}

async function openPage(p){
  try{const m={withdraw:openWithdraw,refer:openRefer,task:openTasks,bonus:openBonus,spin:openSpin,ads:openAds,mining:openMining,support:openSupport,official:openOfficial,notice:openNotice,tutorial:openTutorial};if(m[p])await m[p]()}
  catch(e){console.error(e);showPopup("Oops","Something went wrong.",null,true)}
}
function openTelegram(u){if(!u)return showPopup("Not Available","Support is not configured.",null,true);const url=/^https?:\/\//i.test(u)?u:"https://t.me/"+u;if(tg&&tg.openTelegramLink&&url.includes("t.me/"))tg.openTelegramLink(url);else window.open(url,"_blank")}
function openExternal(u){if(!u)return showPopup("Not Available","Link not configured.",null,true);if(tg&&tg.openLink)tg.openLink(u);else window.open(u,"_blank")}

function loadBanner(){
  const box=document.getElementById("bannerBox");
  if(!box)return;
  const bannerUrl="https://i.ibb.co/GfL8xMpN/Tkpay-Free-Earning-Bot-Banner.png";
  box.innerHTML=`<img class="banner" src="${bannerUrl}" alt="TK Pay Free Earning Bot Banner">`;
}

async function startApp(){
  try{initTelegram();const L=document.getElementById("loaderText");
    L.innerText="Loading settings...";await loadSettings();
    L.innerText="Loading account...";await initializeUser();
    listenUser();await loadBanner();await loadMonetag();loadRecentWithdrawActivity();
    await new Promise(r=>setTimeout(r,1200));
    document.getElementById("loading").style.display="none";
  }catch(e){console.error(e);document.getElementById("loaderText").innerText="Failed to load";showToast(e.message||"Application failed to start")}
}
startApp();
</script></body></html>
