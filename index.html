<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e2136e">
<title>Refer Bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
:root{--pink:#e2136e;--pink2:#f52a83;--soft:#fff3f8;--text:#171717;--muted:#777;--card:#fff;--line:#eee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f7f7f7;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
button{border:0;cursor:pointer}
#splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(145deg,#d90b67,#f32882);display:flex;align-items:center;justify-content:center;color:#fff;transition:.45s}
.splashBox{text-align:center}
.splashLogo{width:104px;height:104px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;margin:auto;box-shadow:0 18px 50px #8c004566;overflow:hidden}
.splashLogo img{width:100%;height:100%;object-fit:cover}
.logoFallback{font-size:58px;font-weight:900;color:var(--pink)}
.splashTitle{font-size:27px;font-weight:900;margin-top:20px}
.splashSub{opacity:.82;margin-top:5px;font-size:14px}
.loader{width:38px;height:38px;border:4px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin:24px auto 0}
@keyframes spin{to{transform:rotate(360deg)}}
#app{display:none;max-width:760px;margin:auto;padding-bottom:95px}
.top{background:linear-gradient(150deg,#d90b67,#f52b82);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 27px;border-radius:0 0 28px 28px;box-shadow:0 8px 30px #d70a6730}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.profile{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:56px;height:56px;border-radius:50%;background:#fff;overflow:hidden;border:3px solid #fff8;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatarText{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--pink);font-weight:900;font-size:22px}
.name{font-size:19px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.username{font-size:12px;opacity:.78;margin-top:2px}
.iconBtn{width:43px;height:43px;border-radius:50%;background:#ffffff22;color:#fff;border:1px solid #fff4;display:flex;align-items:center;justify-content:center;font-size:21px}
.balance{margin-top:18px;background:#ffffff18;border:1px solid #ffffff30;border-radius:18px;padding:15px 17px;display:flex;align-items:center;justify-content:space-between}
.balance small{display:block;opacity:.78;font-size:12px}.balance strong{font-size:25px;display:block;margin-top:2px}.balance .coin{font-size:31px}
.content{padding:17px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.service{background:var(--card);border-radius:19px;padding:13px 5px 12px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 20px #0000000a;border:1px solid #f0f0f0;transition:.15s}
.service:active{transform:scale(.96)}
.serviceIcon{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--soft);font-size:27px}
.service b{font-size:12px;text-align:center;line-height:1.15}
.banner{margin:18px 0;border-radius:19px;overflow:hidden;background:#eee;min-height:130px;box-shadow:0 6px 20px #0000000a}
.banner img{width:100%;display:block;max-height:230px;object-fit:cover}.bannerEmpty{min-height:130px;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:13px}
.sectionTitle{font-size:20px;font-weight:900;margin:22px 2px 11px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.quick button{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;text-align:left;font-weight:800;box-shadow:0 4px 15px #00000008}
.bottom{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:#fffffff2;backdrop-filter:blur(16px);border-top:1px solid #eee;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr)}
.navBtn{background:none;color:#666;font-size:11px;font-weight:750;padding:5px}.navBtn span{display:block;font-size:23px;margin-bottom:2px}.navBtn.active{color:var(--pink)}
.overlay{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:flex-end}
.sheet{width:min(760px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:27px 27px 0 0;padding:20px 17px calc(25px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.sheetHead h2{margin:0;font-size:22px}.close{width:38px;height:38px;border-radius:50%;background:#f4f4f4;font-size:21px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 4px 15px #00000007}
.label{font-size:12px;color:#777;margin-bottom:7px;font-weight:700}
.input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;outline:none;background:#fafafa}.input:focus{border-color:var(--pink)}
.primary{width:100%;padding:14px;border-radius:13px;background:var(--pink);color:#fff;font-weight:850;margin-top:10px}
.secondary{padding:11px 15px;border-radius:11px;background:#fff0f6;color:var(--pink);font-weight:800}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}
.method{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #eee;border-radius:15px;margin:8px 0}.method img{width:43px;height:43px;object-fit:contain;border-radius:10px}.method b{font-size:14px}
.refBox{background:linear-gradient(135deg,#fff1f7,#fff);border:1px dashed #ef78ad;padding:15px;border-radius:16px;word-break:break-all;color:#b40855;font-weight:750;font-size:13px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat>div{background:#fafafa;border-radius:15px;padding:14px}.stat strong{font-size:21px;display:block}.stat span{font-size:11px;color:#777}
.task{display:flex;justify-content:space-between;gap:12px;align-items:center}.taskTitle{font-weight:850}.taskReward{font-size:12px;color:#777;margin-top:4px}
.notice{background:#fff7df;border:1px solid #ffe6a0;border-radius:15px;padding:13px;line-height:1.5;font-size:13px}
.spinWrap{position:relative;width:280px;height:280px;margin:12px auto 20px}.wheel{width:100%;height:100%;border-radius:50%;border:10px solid #fff;box-shadow:0 8px 30px #0002;background:conic-gradient(#ff4f95 0 45deg,#ffb12b 45deg 90deg,#54c7ff 90deg 135deg,#8f6cff 135deg 180deg,#52d28c 180deg 225deg,#ff6b4b 225deg 270deg,#f5ce42 270deg 315deg,#52a9ff 315deg 360deg);transition:transform 4s cubic-bezier(.15,.7,.15,1);display:flex;align-items:center;justify-content:center}.wheel span{width:72px;height:72px;border-radius:50%;background:#fff;color:var(--pink);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:950;box-shadow:0 3px 12px #0002}.pointer{position:absolute;top:-3px;left:50%;transform:translateX(-50%);font-size:29px;color:#222}
.mine{background:linear-gradient(145deg,#171717,#353535);color:#fff;border-radius:20px;padding:19px}.mine h3{margin:0 0 6px}.mine p{color:#bbb;font-size:13px;line-height:1.5}.mineAmount{font-size:30px;font-weight:950;color:#ff70ac}
.empty{text-align:center;color:#888;padding:25px 5px;font-size:13px}
.toast{position:fixed;z-index:99999;left:50%;bottom:90px;transform:translateX(-50%) translateY(15px);background:#222;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%)}
.spinBtn{display:block;margin:auto;width:150px;padding:14px;border-radius:30px;background:var(--pink);color:#fff;font-weight:900}
@media(max-width:390px){.grid{gap:7px}.service{min-height:105px}.serviceIcon{width:47px;height:47px}.service b{font-size:11px}}
</style>
</head>
<body>

<div id="splash">
  <div class="splashBox">
    <div class="splashLogo" id="splashLogo"><div class="logoFallback">৳</div></div>
    <div class="splashTitle" id="splashTitle">Refer Bot</div>
    <div class="splashSub">Telegram Mini App</div>
    <div class="loader"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="topbar">
      <div class="profile">
        <div class="avatar" id="avatar"><div class="avatarText">U</div></div>
        <div>
          <div class="name" id="userName">Loading...</div>
          <div class="username" id="userUsername">@telegram</div>
        </div>
      </div>
      <button class="iconBtn" onclick="openSheet('notice')">🔔</button>
    </div>
    <div class="balance">
      <div><small>Available Balance</small><strong id="balance">৳0.00</strong></div>
      <div class="coin">৳</div>
    </div>
  </header>

  <main class="content">
    <div class="grid" id="grid1">
      <button class="service" onclick="openSheet('withdraw')"><div class="serviceIcon">💸</div><b>Withdraw</b></button>
      <button class="service" onclick="openSheet('refer')"><div class="serviceIcon">👥</div><b>Refer</b></button>
      <button class="service" onclick="openSheet('task')"><div class="serviceIcon">🎯</div><b>Task</b></button>
      <button class="service" onclick="openSheet('bonus')"><div class="serviceIcon">🎁</div><b>Bonus</b></button>
    </div>

    <div class="banner" id="banner"></div>

    <div class="grid" id="grid2">
      <button class="service" onclick="openSheet('spin')"><div class="serviceIcon">🎡</div><b>Spin</b></button>
      <button class="service" onclick="openSheet('mining')"><div class="serviceIcon">⛏️</div><b>Mining</b></button>
      <button class="service" onclick="openSheet('support')"><div class="serviceIcon">💬</div><b>Support</b></button>
      <button class="service" onclick="openSheet('official')"><div class="serviceIcon">📢</div><b>Official Update</b></button>
    </div>

    <div class="sectionTitle">Quick Features</div>
    <div class="quick">
      <button onclick="openSheet('notice')">🔔 &nbsp; Notice</button>
      <button onclick="openSheet('tutorial')">🎬 &nbsp; Tutorial</button>
    </div>
  </main>

  <nav class="bottom">
    <button class="navBtn active" onclick="goHome(this)"><span>⌂</span>Home</button>
    <button class="navBtn" onclick="openSheet('refer');setActive(this)"><span>👥</span>Refer</button>
    <button class="navBtn" onclick="openSheet('mining');setActive(this)"><span>⛏</span>Mining</button>
    <button class="navBtn" onclick="openSheet('withdraw');setActive(this)"><span>💸</span>Withdraw</button>
  </nav>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================
   FIREBASE CONFIG
========================= */
const firebaseConfig = {
  apiKey: "AIzaSyDDW-MPGwDxEtSDW-wE41zy2hHtT1Kc",
  authDomain: "bkash-refer-bot.firebaseapp.com",
  databaseURL: "https://bkash-refer-bot-default-rtdb.firebaseio.com",
  projectId: "bkash-refer-bot",
  storageBucket: "bkash-refer-bot.firebasestorage.app",
  messagingSenderId: "642702342319",
  appId: "1:642702342319:web:2f92be0cf13d77b3773c5a",
  measurementId: "G-ZB8XWS70W4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* Telegram user — NO Firebase Authentication */
const tg = window.Telegram?.WebApp;
if(tg){ tg.ready(); tg.expand(); }

let tgUser = tg?.initDataUnsafe?.user || null;
const DEMO_USER = {
  id: "demo_" + Date.now(),
  first_name: "Telegram",
  last_name: "User",
  username: "telegram_user",
  photo_url: ""
};

/* For local browser testing only. In Telegram, real Telegram ID is used. */
if(!tgUser) tgUser = DEMO_USER;

const UID = String(tgUser.id);
let userData = {};
let settings = {};
let refCode = tg?.initDataUnsafe?.start_param || "";
let botUsername = "";
let spinBusy = false;

/* Defaults keep the UI working even before admin creates settings. */
const DEFAULTS = {
  general:{
    botName:"Refer Bot",
    logoUrl:"",
    currency:"৳",
    welcome:"Welcome to our Telegram Mini App"
  },
  banner:{imageUrl:""},
  withdraw:{minimum:100,minimumRefs:0},
  mining:{baseDaily:30,ref3:50,ref6:70,ref10:100,claimHours:24},
  spin:{min:50,max:150,spinsPerReferral:1},
  support:{telegram:"https://t.me/"},
  official:{telegram:"https://t.me/"},
  tutorial:{videoUrl:""},
  notice:{title:"Notice",text:"Welcome! Please complete tasks and invite friends to earn."}
};

function mergeDefaults(obj, def){
  obj=obj||{};
  const out={...def,...obj};
  for(const k in def) if(def[k]&&typeof def[k]==="object"&&!Array.isArray(def[k]))
    out[k]=mergeDefaults(obj[k],def[k]);
  return out;
}

async function read(path){
  const s=await db.ref(path).once("value");
  return s.val();
}

async function boot(){
  try{
    const snap=await db.ref("settings").once("value");
    settings=mergeDefaults(snap.val(),DEFAULTS);
  }catch(e){
    settings=DEFAULTS;
    console.warn("Settings read failed:",e);
  }

  applyBrand();

  if(!userData || !userData.id){
    userData={
      id:UID,
      name:[tgUser.first_name,tgUser.last_name].filter(Boolean).join(" ") || "Telegram User",
      username:tgUser.username || "",
      photo:tgUser.photo_url || "",
      balance:0,
      referCount:0,
      spinsAvailable:0,
      totalEarned:0,
      referredBy:"",
      createdAt:Date.now()
    };
  }

  try{
    const ref=db.ref("users/"+UID);
    const existing=(await ref.once("value")).val();

    if(existing){
      userData={...userData,...existing};
      await ref.update({
        name:userData.name,
        username:userData.username,
        photo:userData.photo,
        lastSeen:Date.now()
      });
    }else{
      userData.createdAt=Date.now();
      userData.lastSeen=Date.now();
      userData.referredBy=extractReferrer(refCode);
      await ref.set(userData);
      await processReferral(userData.referredBy);
    }

    renderUser();
    renderBanner();
    document.getElementById("app").style.display="block";
    setTimeout(()=>{
      document.getElementById("splash").style.opacity="0";
      setTimeout(()=>document.getElementById("splash").style.display="none",450);
    },1200);
  }catch(e){
    /* No authentication error screen. The app still opens with Telegram data. */
    console.error(e);
    renderUser();
    renderBanner();
    document.getElementById("app").style.display="block";
    setTimeout(()=>{
      document.getElementById("splash").style.opacity="0";
      setTimeout(()=>document.getElementById("splash").style.display="none",450);
    },1200);
  }
}

function extractReferrer(code){
  if(!code) return "";
  code=String(code);
  if(code.startsWith("ref_")) return code.slice(4);
  if(code.startsWith("r_")) return code.slice(2);
  return code;
}

async function processReferral(referrer){
  if(!referrer || referrer===UID || userData.referredByProcessed) return;
  try{
    const marker=db.ref("referrals/"+referrer+"/"+UID);
    const already=(await marker.once("value")).exists();
    if(already) return;

    await marker.set({
      userId:UID,
      name:userData.name,
      username:userData.username,
      joinedAt:Date.now()
    });

    const ref=db.ref("users/"+referrer);
    await ref.transaction(u=>{
      if(!u) return u;
      u.referCount=Number(u.referCount||0)+1;
      u.spinsAvailable=Number(u.spinsAvailable||0)+Number(settings.spin.spinsPerReferral||1);
      u.totalEarned=Number(u.totalEarned||0);
      return u;
    });
    userData.referredByProcessed=true;
    await db.ref("users/"+UID).update({referredByProcessed:true});
  }catch(e){console.warn("Referral:",e)}
}

function applyBrand(){
  const g=settings.general;
  document.title=g.botName||"Refer Bot";
  document.getElementById("splashTitle").textContent=g.botName||"Refer Bot";
  const logo=g.logoUrl;
  if(logo){
    const img=document.createElement("img");
    img.src=logo;
    img.onerror=()=>{};
    document.getElementById("splashLogo").innerHTML="";
    document.getElementById("splashLogo").appendChild(img);
  }
  document.documentElement.style.setProperty("--pink",settings.general.primaryColor||"#e2136e");
  document.documentElement.style.setProperty("--pink2",settings.general.secondaryColor||"#f52a83");
}

function renderUser(){
  const name=userData.name || [tgUser.first_name,tgUser.last_name].filter(Boolean).join(" ") || "Telegram User";
  document.getElementById("userName").textContent=name;
  document.getElementById("userUsername").textContent=userData.username ? "@"+userData.username : "Telegram ID: "+UID;
  document.getElementById("balance").textContent=(settings.general.currency||"৳")+Number(userData.balance||0).toFixed(2);

  if(userData.photo){
    document.getElementById("avatar").innerHTML='<img src="'+escapeAttr(userData.photo)+'" alt="">';
  }else{
    document.getElementById("avatar").innerHTML='<div class="avatarText">'+escapeHtml((name[0]||"U").toUpperCase())+'</div>';
  }
}

function renderBanner(){
  const el=document.getElementById("banner");
  const url=settings.banner?.imageUrl||settings.banner?.url||"";
  if(url) el.innerHTML='<img src="'+escapeAttr(url)+'" alt="Banner">';
  else el.innerHTML='<div class="bannerEmpty">Admin banner will appear here</div>';
}

function currency(n){return (settings.general.currency||"৳")+Number(n||0).toFixed(2)}
function toast(t){
  const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove("show"),2300);
}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function escapeAttr(s){return escapeHtml(s).replace(/javascript:/gi,"")}
function openLink(url){
  if(!url)return toast("Link is not configured yet.");
  if(tg?.openTelegramLink && /t\.me\//i.test(url)) tg.openTelegramLink(url);
  else window.open(url,"_blank","noopener");
}
function openSheet(type){
  const s=document.getElementById("sheet");
  let html="";
  const close=`<button class="close" onclick="closeSheet()">×</button>`;

  if(type==="refer"){
    const base=botUsername?`https://t.me/${botUsername}?startapp=ref_${UID}`:`Open the bot from Telegram and use your personal referral link`;
    html=`<div class="sheetHead"><h2>👥 Refer & Earn</h2>${close}</div>
    <div class="card"><div class="label">Your Referral Link</div><div class="refBox" id="refLink">${escapeHtml(base)}</div>
    <div class="row" style="margin-top:10px"><button class="primary" onclick="copyRef()" style="margin:0;flex:1">📋 Copy Link</button><button class="secondary" onclick="shareRef()">↗ Share</button></div></div>
    <div class="stat"><div><strong>${Number(userData.referCount||0)}</strong><span>Total Referrals</span></div><div><strong>${Number(userData.spinsAvailable||0)}</strong><span>Spin Available</span></div></div>
    <div class="sectionTitle">Your Referred Users</div><div id="refUsers"><div class="empty">Loading...</div></div>`;
    setTimeout(loadReferrals,30);
  }

  if(type==="withdraw"){
    const min=Number(settings.withdraw.minimum||100);
    const minRefs=Number(settings.withdraw.minimumRefs||0);
    html=`<div class="sheetHead"><h2>💸 Withdraw</h2>${close}</div>
    <div class="notice">Minimum withdraw: <b>${currency(min)}</b><br>Minimum referrals: <b>${minRefs}</b></div>
    <div class="card"><div class="label">Amount</div><input class="input" id="wdAmount" type="number" min="${min}" placeholder="${min}">
    <div class="label" style="margin-top:12px">Account Number</div><input class="input" id="wdNumber" placeholder="017XXXXXXXX">
    <div class="label" style="margin-top:12px">Withdraw Method</div><select class="input" id="wdMethod">${withdrawMethodsHtml()}</select>
    <button class="primary" onclick="submitWithdraw()">Request Withdraw</button></div>`;
  }

  if(type==="task"){
    html=`<div class="sheetHead"><h2>🎯 Tasks</h2>${close}</div><div id="taskList"><div class="empty">Loading tasks...</div></div>`;
    setTimeout(loadTasks,30);
  }

  if(type==="bonus"){
    html=`<div class="sheetHead"><h2>🎁 Bonus</h2>${close}</div>
    <div class="card"><div style="font-size:42px;text-align:center">🎁</div><h3 style="text-align:center">Welcome Bonus</h3>
    <p style="text-align:center;color:#777">Your available bonus is controlled by the admin.</p>
    <button class="primary" onclick="claimBonus()">Claim Bonus</button></div>`;
  }

  if(type==="spin"){
    html=`<div class="sheetHead"><h2>🎡 Lucky Spin</h2>${close}</div>
    <div class="notice">Available spins: <b id="spinCount">${Number(userData.spinsAvailable||0)}</b><br>Each referral can give you a spin according to admin settings.</div>
    <div class="spinWrap"><div class="pointer">▼</div><div class="wheel" id="wheel"><span>SPIN</span></div></div>
    <button class="spinBtn" onclick="doSpin()">🎡 SPIN NOW</button>`;
  }

  if(type==="mining"){
    const earned=Number(userData.miningEarned||0);
    const last=Number(userData.lastMiningClaim||0);
    const hours=Number(settings.mining.claimHours||24);
    const ready=!last || Date.now()-last>=hours*3600000;
    const amount=getMiningAmount();
    html=`<div class="sheetHead"><h2>⛏️ Mining</h2>${close}</div>
    <div class="mine"><h3>Daily Mining</h3><p>Mining speed increases with referrals. Your current estimated daily reward:</p>
    <div class="mineAmount">${currency(amount)}</div><p>Referral count: <b>${Number(userData.referCount||0)}</b></p></div>
    <div class="card"><div class="label">Status</div><b>${ready?"🟢 Ready to claim":"⏳ Mining cooldown active"}</b>
    ${!ready?`<p style="color:#777;font-size:12px">Next claim: ${new Date(last+hours*3600000).toLocaleString()}</p>`:""}
    <button class="primary" onclick="claimMining()" ${ready?"":"disabled"} style="${ready?"":"opacity:.45"}">${ready?"Start / Claim Mining":"Come back later"}</button></div>`;
  }

  if(type==="support"){
    html=`<div class="sheetHead"><h2>💬 Support</h2>${close}</div><div class="card"><div class="sectionTitle" style="margin-top:0">Need help?</div><p style="color:#777">Contact the official support account configured by admin.</p><button class="primary" onclick="openLink('${escapeAttr(settings.support.telegram||"")}')">Open Telegram Support</button></div>`;
  }

  if(type==="official"){
    html=`<div class="sheetHead"><h2>📢 Official Update</h2>${close}</div><div class="card"><p style="color:#777">Join the official channel for announcements and updates.</p><button class="primary" onclick="openLink('${escapeAttr(settings.official.telegram||"")}')">Open Official Channel</button></div>`;
  }

  if(type==="notice"){
    html=`<div class="sheetHead"><h2>🔔 ${escapeHtml(settings.notice.title||"Notice")}</h2>${close}</div><div class="notice">${escapeHtml(settings.notice.text||"No notice available.")}</div>`;
  }

  if(type==="tutorial"){
    html=`<div class="sheetHead"><h2>🎬 Tutorial</h2>${close}</div><div class="card"><p style="color:#777">Watch the tutorial configured by admin.</p><button class="primary" onclick="openLink('${escapeAttr(settings.tutorial.videoUrl||"")}')">▶ Watch Tutorial</button></div>`;
  }

  s.innerHTML=html;
  document.getElementById("overlay").style.display="flex";
}
function closeSheet(){document.getElementById("overlay").style.display="none"}

function withdrawMethodsHtml(){
  const m=settings.withdrawMethods||settings.withdraw?.methods||{};
  const arr=Array.isArray(m)?m:Object.entries(m).map(([id,v])=>({id,...v}));
  if(!arr.length)return `<option value="default">Withdraw Method</option>`;
  return arr.map(x=>`<option value="${escapeAttr(x.name||x.id)}">${escapeHtml(x.name||x.id)}</option>`).join("");
}

async function submitWithdraw(){
  const amount=Number(document.getElementById("wdAmount")?.value||0);
  const number=document.getElementById("wdNumber")?.value.trim();
  const method=document.getElementById("wdMethod")?.value;
  const min=Number(settings.withdraw.minimum||100);
  const minRefs=Number(settings.withdraw.minimumRefs||0);

  if(amount<min)return toast("Minimum withdraw is "+currency(min));
  if(Number(userData.referCount||0)<minRefs)return toast("You need at least "+minRefs+" referrals.");
  if(amount>Number(userData.balance||0))return toast("Insufficient balance.");
  if(!number)return toast("Enter your account number.");

  try{
    const req=db.ref("withdrawals").push();
    await req.set({
      id:req.key,userId:UID,name:userData.name||"",username:userData.username||"",
      amount,number,method,status:"pending",createdAt:Date.now()
    });
    await db.ref("users/"+UID).update({balance:Number(userData.balance||0)-amount});
    userData.balance-=amount;renderUser();
    toast("Withdraw request submitted.");
    closeSheet();
  }catch(e){toast("Request failed. Check Firebase rules.")}
}

async function loadTasks(){
  const box=document.getElementById("taskList");if(!box)return;
  try{
    const val=await read("tasks");
    const arr=Array.isArray(val)?val:Object.entries(val||{}).map(([id,v])=>({id,...v}));
    if(!arr.length){box.innerHTML='<div class="empty">No task available right now.</div>';return}
    box.innerHTML=arr.filter(x=>x.enabled!==false).map(x=>`
      <div class="card task"><div><div class="taskTitle">${escapeHtml(x.name||"Task")}</div><div class="taskReward">Reward: ${currency(x.reward||0)}</div></div>
      <button class="secondary" onclick="openTask('${escapeAttr(x.id||"")}','${escapeAttr(x.link||x.url||"")}')">Open</button></div>`).join("");
  }catch(e){box.innerHTML='<div class="empty">Could not load tasks.</div>'}
}
async function openTask(id,url){
  openLink(url);
  if(!id)return;
  try{
    const marker=db.ref("taskClaims/"+id+"/"+UID);
    if(!(await marker.exists())){
      await marker.set({userId:UID,createdAt:Date.now()});
      const task=(await read("tasks/"+id))||{};
      const reward=Number(task.reward||0);
      if(reward>0){
        userData.balance=Number(userData.balance||0)+reward;
        userData.totalEarned=Number(userData.totalEarned||0)+reward;
        await db.ref("users/"+UID).update({balance:userData.balance,totalEarned:userData.totalEarned});
        renderUser();toast("Task reward added: "+currency(reward));
      }
    }else toast("Task already completed.");
  }catch(e){toast("Task could not be verified.")}
}

async function loadReferrals(){
  const box=document.getElementById("refUsers");if(!box)return;
  try{
    const val=await read("referrals/"+UID);
    const arr=Object.values(val||{});
    if(!arr.length){box.innerHTML='<div class="empty">No referrals yet.</div>';return}
    box.innerHTML=arr.sort((a,b)=>(b.joinedAt||0)-(a.joinedAt||0)).map(x=>`
      <div class="card row"><div class="avatar" style="width:42px;height:42px"><div class="avatarText">${escapeHtml((x.name||"U")[0])}</div></div>
      <div><b>${escapeHtml(x.name||"Telegram User")}</b><div style="font-size:12px;color:#777">${x.username?"@"+escapeHtml(x.username):"Telegram user"}</div></div></div>`).join("");
  }catch(e){box.innerHTML='<div class="empty">Could not load referrals.</div>'}
}
function getRefLink(){
  return botUsername?`https://t.me/${botUsername}?startapp=ref_${UID}`:"";
}
async function copyRef(){
  const link=getRefLink();
  if(!link)return toast("Set your Telegram bot username first.");
  try{await navigator.clipboard.writeText(link);toast("Referral link copied!")}catch(e){toast(link)}
}
function shareRef(){
  const link=getRefLink();
  if(!link)return toast("Set your Telegram bot username first.");
  const text=encodeURIComponent("Join "+(settings.general.botName||"our bot")+" and earn rewards!");
  const share="https://t.me/share/url?url="+encodeURIComponent(link)+"&text="+text;
  openLink(share);
}

function getMiningAmount(){
  const r=Number(userData.referCount||0),m=settings.mining||{};
  if(r>=10)return Number(m.ref10||100);
  if(r>=6)return Number(m.ref6||70);
  if(r>=3)return Number(m.ref3||50);
  return Number(m.baseDaily||30);
}

async function claimMining(){
  const last=Number(userData.lastMiningClaim||0);
  const hours=Number(settings.mining.claimHours||24);
  if(last && Date.now()-last<hours*3600000)return toast("Mining is not ready yet.");
  const amount=getMiningAmount();
  try{
    userData.balance=Number(userData.balance||0)+amount;
    userData.miningEarned=Number(userData.miningEarned||0)+amount;
    userData.totalEarned=Number(userData.totalEarned||0)+amount;
    userData.lastMiningClaim=Date.now();
    await db.ref("users/"+UID).update({
      balance:userData.balance,miningEarned:userData.miningEarned,
      totalEarned:userData.totalEarned,lastMiningClaim:userData.lastMiningClaim
    });
    renderUser();toast("Mining claimed: "+currency(amount));openSheet("mining");
  }catch(e){toast("Mining claim failed.")}
}

async function doSpin(){
  if(spinBusy)return;
  const spins=Number(userData.spinsAvailable||0);
  if(spins<1)return toast("No spin available. Refer a friend to earn a spin.");
  spinBusy=true;
  const wheel=document.getElementById("wheel");
  const extra=1440+Math.floor(Math.random()*720);
  wheel.style.transform=`rotate(${extra}deg)`;
  setTimeout(async()=>{
    const min=Number(settings.spin.min||50),max=Number(settings.spin.max||150);
    const reward=Math.floor(Math.random()*(max-min+1))+min;
    try{
      userData.spinsAvailable=spins-1;
      userData.balance=Number(userData.balance||0)+reward;
      userData.totalEarned=Number(userData.totalEarned||0)+reward;
      await db.ref("users/"+UID).update({
        spinsAvailable:userData.spinsAvailable,balance:userData.balance,totalEarned:userData.totalEarned
      });
      await db.ref("spinHistory/"+UID).push({reward,createdAt:Date.now()});
      renderUser();
      toast("🎉 You won "+currency(reward)+"!");
      const c=document.getElementById("spinCount");if(c)c.textContent=userData.spinsAvailable;
    }catch(e){toast("Spin failed.")}
    spinBusy=false;
  },4200);
}

async function claimBonus(){
  const amount=Number(settings.general.welcomeBonus||0);
  if(amount<=0)return toast("No bonus configured.");
  if(userData.bonusClaimed)return toast("Bonus already claimed.");
  try{
    userData.balance=Number(userData.balance||0)+amount;
    userData.totalEarned=Number(userData.totalEarned||0)+amount;
    userData.bonusClaimed=true;
    await db.ref("users/"+UID).update({balance:userData.balance,totalEarned:userData.totalEarned,bonusClaimed:true});
    renderUser();toast("Bonus claimed: "+currency(amount));closeSheet();
  }catch(e){toast("Bonus claim failed.")}
}

function setActive(el){document.querySelectorAll(".navBtn").forEach(x=>x.classList.remove("active"));el.classList.add("active")}
function goHome(el){setActive(el);window.scrollTo({top:0,behavior:"smooth"})}

/* Try to discover bot username from a public admin setting. */
async function loadBotUsername(){
  try{
    const v=await read("settings/general/botUsername");
    if(v)botUsername=String(v).replace("@","");
  }catch(e){}
}

/* Prevent Telegram closing while a sheet is open. */
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

(async()=>{
  await loadBotUsername();
  await boot();
})();
</script>
</body>
