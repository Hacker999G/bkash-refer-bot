<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --pink:#e2136e;
    --pink2:#f52f82;
    --dark:#171719;
    --bg:#f5f6f8;
    --white:#fff;
    --text:#202124;
    --muted:#777;
    --green:#12a36a;
    --red:#ef4444;
    --orange:#f59e0b;
    --blue:#3b82f6;
    --border:#e9e9ed;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,input,select,textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

.login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at 10% 10%,#ff79ae 0,transparent 28%),
        radial-gradient(circle at 90% 90%,#e2136e 0,transparent 30%),
        #f7f7f8;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:28px;
    padding:30px;
    box-shadow:0 20px 60px rgba(0,0,0,.12);
}

.logo{
    width:65px;
    height:65px;
    margin:0 auto 15px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--pink),#ff579a);
    color:white;
    font-size:28px;
    font-weight:900;
}

.login-box h1{
    text-align:center;
    font-size:24px;
}

.login-box p{
    text-align:center;
    color:#888;
    font-size:12px;
    margin-top:7px;
    margin-bottom:22px;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;
    font-size:11px;
    font-weight:800;
    color:#555;
    margin-bottom:7px;
}

.input,
.select,
.textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:13px;
    height:48px;
    padding:0 13px;
    outline:none;
    background:#fff;
    font-size:13px;
}

.textarea{
    height:100px;
    padding:12px;
    resize:vertical;
}

.input:focus,
.select:focus,
.textarea:focus{
    border-color:var(--pink);
}

.btn{
    min-height:43px;
    border-radius:12px;
    padding:0 15px;
    font-size:12px;
    font-weight:800;
}

.btn-primary{
    background:var(--pink);
    color:white;
}

.btn-secondary{
    background:#f2f3f5;
    color:#333;
}

.btn-success{
    background:var(--green);
    color:white;
}

.btn-danger{
    background:var(--red);
    color:white;
}

.btn-warning{
    background:var(--orange);
    color:white;
}

.btn-blue{
    background:var(--blue);
    color:white;
}

/* ================= APP ================= */

.app{
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:245px;
    background:#171719;
    color:white;
    z-index:100;
    overflow:auto;
}

.brand{
    padding:22px 20px;
    font-size:20px;
    font-weight:900;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.brand span{
    color:#ff4c95;
}

.admin-info{
    padding:15px 20px;
    font-size:10px;
    color:#999;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.nav{
    padding:12px;
}

.nav-btn{
    width:100%;
    height:44px;
    border-radius:11px;
    margin-bottom:4px;
    background:transparent;
    color:#aaa;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 13px;
    text-align:left;
    font-size:12px;
    font-weight:700;
}

.nav-btn:hover{
    background:rgba(255,255,255,.06);
    color:white;
}

.nav-btn.active{
    background:var(--pink);
    color:white;
}

.nav-icon{
    width:23px;
    text-align:center;
    font-size:17px;
}

.main{
    margin-left:245px;
    min-height:100vh;
}

.topbar{
    height:68px;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:50;
}

.page-title{
    font-size:19px;
    font-weight:900;
}

.top-right{
    display:flex;
    align-items:center;
    gap:9px;
}

.content{
    padding:24px;
    max-width:1450px;
}

/* ================= CARDS ================= */

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:17px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.025);
}

.stat-card{
    display:flex;
    align-items:center;
    gap:14px;
}

.stat-icon{
    width:50px;
    height:50px;
    border-radius:15px;
    background:#fff0f6;
    color:var(--pink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
}

.stat-label{
    font-size:10px;
    color:#888;
}

.stat-value{
    font-size:22px;
    font-weight:900;
    margin-top:4px;
}

/* ================= SECTION ================= */

.section{
    margin-top:20px;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.section-title{
    font-size:16px;
    font-weight:900;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

/* ================= TABLE ================= */

.table-wrap{
    background:white;
    border:1px solid var(--border);
    border-radius:17px;
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th{
    background:#fafafa;
    color:#777;
    font-size:10px;
    text-align:left;
    padding:13px;
    border-bottom:1px solid var(--border);
}

td{
    padding:13px;
    border-bottom:1px solid #f0f0f0;
    font-size:11px;
    vertical-align:middle;
}

tr:last-child td{
    border-bottom:0;
}

.user-cell{
    display:flex;
    align-items:center;
    gap:9px;
}

.user-avatar{
    width:36px;
    height:36px;
    border-radius:50%;
    object-fit:cover;
    background:#eee;
}

.user-name{
    font-weight:800;
}

.user-id{
    color:#999;
    font-size:9px;
    margin-top:2px;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:5px 8px;
    border-radius:20px;
    font-size:9px;
    font-weight:800;
}

.badge-green{
    color:#087d50;
    background:#e5f8ef;
}

.badge-red{
    color:#b91c1c;
    background:#feecec;
}

.badge-orange{
    color:#a16207;
    background:#fff5d9;
}

.badge-blue{
    color:#1d4ed8;
    background:#eaf1ff;
}

/* ================= SEARCH ================= */

.search{
    width:260px;
    max-width:100%;
    height:42px;
    border:1px solid var(--border);
    border-radius:11px;
    padding:0 12px;
    outline:none;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:22px;
}

.modal-head{
    position:sticky;
    top:0;
    z-index:2;
    background:white;
    border-bottom:1px solid var(--border);
    padding:17px 19px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-title{
    font-weight:900;
    font-size:17px;
}

.close{
    width:35px;
    height:35px;
    border-radius:50%;
    background:#f2f2f4;
    font-size:18px;
}

.modal-body{
    padding:19px;
}

/* ================= FORM GRID ================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.full{
    grid-column:1/-1;
}

/* ================= EMPTY ================= */

.empty{
    padding:40px;
    text-align:center;
    color:#999;
    font-size:12px;
}

/* ================= MOBILE ================= */

.mobile-menu{
    display:none;
}

@media(max-width:900px){

    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
    }

    .mobile-menu{
        display:block;
        width:40px;
        height:40px;
        border-radius:10px;
        background:#f2f2f4;
        font-size:19px;
    }

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .content{
        padding:15px;
    }

    .topbar{
        padding:0 15px;
    }

    .page-title{
        font-size:16px;
    }

    .cards{
        gap:9px;
    }

    .card{
        padding:13px;
    }

    .stat-icon{
        width:42px;
        height:42px;
    }

    .stat-value{
        font-size:18px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

}
</style>
</head>

<body>

<!-- =========================================================
     LOGIN
========================================================= -->

<div id="loginScreen" class="login-screen">

    <div class="login-box">

        <div class="logo">৳</div>

        <h1>Admin Panel</h1>

        <p>
            Secure administrator login
        </p>

        <div class="field">

            <label>EMAIL</label>

            <input
                id="loginEmail"
                class="input"
                type="email"
                placeholder="Admin email">

        </div>

        <div class="field">

            <label>PASSWORD</label>

            <input
                id="loginPassword"
                class="input"
                type="password"
                placeholder="Password">

        </div>

        <button
            class="btn btn-primary"
            style="width:100%;height:49px"

        <div id="loginError"
             style="
             color:#ef4444;
             font-size:11px;
             text-align:center;

    </div>

</div>


<!-- =========================================================
     ADMIN APP
========================================================= -->

<div id="adminApp" class="app hidden">

    <!-- SIDEBAR -->

    <aside id="sidebar" class="sidebar">

        </div>

        <nav class="nav">

                    onclick="showPage('tasks',this)">
                <span class="nav-icon">🎯</span>
                Tasks

            <button class="nav-btn"
                    onclick="showPage('methods',this)">
                <span class="nav-icon">💳</span>
                Withdraw Methods
            </button>

            <button class="nav-btn"
                    onclick="showPage('notices',this)">
                <span class="nav-icon">🔔</span>
                Notices
            </button>

            <button class="nav-btn"
                    onclick="showPage('settings',this)">
                <span class="nav-icon">⚙️</span>
                Settings
            </button>

            <button class="nav-btn"
                    onclick="showPage('mining',this)">
                <span class="nav-icon">⛏️</span>

            </button>

            <button class="nav-btn"
                    onclick="showPage('bonus',this)">

            </button>

            </button>

            </button>

            <button class="nav-btn"

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <div style="display:flex;align-items:center;gap:10px">

                <button
                    class="mobile-menu"
                    onclick="toggleSidebar()">

                    ☰

                </button>

                <div id="pageTitle"

                    Dashboard

                </div>

            </div>

            <div class="top-right">

                <span id="topBotName"
                      style="
                      font-size:11px;
                      color:#777">
                    Loading...
                </span>

            </div>

        </header>

        <div id="content"
             class="content">
        </div>

    </main>

</div>


<!-- =========================================================
     MODAL
========================================================= -->

<div id="modal"
     class="modal"
     onclick="outsideModal(event)">

    <div class="modal-box">

        <div class="modal-head">

            <div id="modalTitle"
                 class="modal-title">
                Modal
            </div>

            <button class="close"
                    onclick="closeModal()">
                ×
            </button>

        </div>

        <div id="modalBody"
             class="modal-body">
        </div>

    </div>

</div>


<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyDDW-mPGwDxZhETSDWw-we41zy2hHtT1Kc",

    authDomain:
    "bkash-refer-bot.firebaseapp.com",

    databaseURL:
    "https://bkash-refer-bot-default-rtdb.firebaseio.com",

    projectId:
    "bkash-refer-bot",

    storageBucket:
    "bkash-refer-bot.firebasestorage.app",

    messagingSenderId:
    "642702342319",

    appId:
    "1:642702342319:web:2f92be0cf13d77b3773c5a",

    measurementId:
    "G-ZB8XWS70W4"

};

firebase.initializeApp(firebaseConfig);

const auth =
    firebase.auth();

const db =
    firebase.database();


/* =========================================================
   ADMIN UID
========================================================= */

const ADMIN_UID =
    "Wh4gSYv40pPEBdO9TbW57px2oyo2";


let currentPage =
    "dashboard";

let usersCache = {};

let settings = {};


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

    if(value === null || value === undefined)
        return "";

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function money(value){

    return Number(value || 0)
        .toLocaleString("en-US",{
            minimumFractionDigits:2,
            maximumFractionDigits:2
        });

}


function date(value){

    if(!value) return "-";

    return new Date(Number(value))
        .toLocaleString("en-GB",{
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        });

}


function toast(message){

    alert(message);

}


/* =========================================================
   AUTH
========================================================= */

auth.onAuthStateChanged(async user=>{

    if(!user){

        showLogin();

        return;

    }

    /*
       UID verification
    */

    if(user.uid !== ADMIN_UID){

        await auth.signOut();

        showLogin();

        document.getElementById("loginError")
            .innerText =
            "This account is not authorized as admin.";

        return;

    }

    document.getElementById("loginScreen")
        .classList.add("hidden");

    document.getElementById("adminApp")
        .classList.remove("hidden");

    document.getElementById("adminEmail")
        .innerText =
        user.email || "";

    await loadSettings();

    showPage("dashboard");

});


async function login(){

    const email =
        document.getElementById("loginEmail")
        .value.trim();

    const password =
        document.getElementById("loginPassword")
        .value;

    const error =
        document.getElementById("loginError");

    error.innerText = "";

    if(!email || !password){

        error.innerText =
            "Enter email and password.";

        return;

    }

    try{

        await auth.signInWithEmailAndPassword(
            email,
            password
        );

    }catch(e){

        console.error(e);

        error.innerText =
            e.message || "Login failed.";

    }

}


async function logout(){

    await auth.signOut();

}


function showLogin(){

    document.getElementById("loginScreen")
        .classList.remove("hidden");

    document.getElementById("adminApp")
        .classList.add("hidden");

}


/* =========================================================
   NAVIGATION
========================================================= */

function showPage(page,button){

    currentPage = page;

    document
        .querySelectorAll(".nav-btn")
        .forEach(btn=>{
            btn.classList.remove("active");
        });

    if(button){
        button.classList.add("active");
    }

    const titles = {

        dashboard:"Dashboard",

        users:"Users",

        withdrawals:"Withdraw Requests",

        banners:"Banner Manager",

        tasks:"Task Manager",

        methods:"Withdraw Methods",

        notices:"Notice Manager",

        settings:"Bot Settings",

        mining:"Mining Settings",

        bonus:"Bonus Settings",

        spin:"Spin Settings",

        support:"Support",

        tutorial:"Tutorial"

    };

    document.getElementById("pageTitle")
        .innerText =
        titles[page] || "Admin";

    document.getElementById("sidebar")
        .classList.remove("open");

    const pages = {

        dashboard:renderDashboard,

        users:renderUsers,

        withdrawals:renderWithdrawals,

        banners:renderBanners,

        tasks:renderTasks,

        methods:renderMethods,

        notices:renderNotices,

        settings:renderSettings,

        mining:renderMining,

        bonus:renderBonus,

        spin:renderSpin,

        support:renderSupport,

        tutorial:renderTutorial

    };

    if(pages[page]){

        pages[page]();

    }

}


function toggleSidebar(){

    document.getElementById("sidebar")
        .classList.toggle("open");

}


/* =========================================================
   MODAL
========================================================= */

function openModal(title,html){

    document.getElementById("modalTitle")
        .innerText = title;

    document.getElementById("modalBody")
        .innerHTML = html;

    document.getElementById("modal")
        .classList.add("show");

}


function closeModal(){

    document.getElementById("modal")
        .classList.remove("show");

}


function outsideModal(e){

    if(e.target.id === "modal"){

        closeModal();

    }

}


/* =========================================================
   SETTINGS
========================================================= */

async function loadSettings(){

    const snap =
        await db.ref("settings")
        .once("value");

    settings =
        snap.val() || {};

    document.getElementById("topBotName")
        .innerText =
        settings.botName ||
        "Bot";

}


/* =========================================================
   DASHBOARD
========================================================= */

    const content =

    content.innerHTML = `

                    </div>

                        ...
                    </div>
                </div>
            </div>

                    </div>
                </div>
            </div>

            <div class="card stat-card">
                <div class="stat-icon">👥</div>
                <div>
                    <div class="stat-label">TOTAL REFERRALS</div>
                    <div id="statRefer"
                         class="stat-value">
                        ...
                    </div>
                </div>
            </div>

        </div>

        <div class="section">

            <div class="section-head">

                <div class="section-title">
                    Quick Actions
                </div>

            </div>

            <div class="card">

                <div class="actions">

                    <button
                        class="btn btn-primary"
                        onclick="showPage('users')">
                        👤 Manage Users
                    </button>

                    <button
                        class="btn btn-success"
                        onclick="showPage('withdrawals')">
                        💸 Withdrawals
                    </button>

                    <button
                        class="btn btn-blue"
                        onclick="showPage('tasks')">
                        🎯 Manage Tasks
                    </button>

                    <button
                        class="btn btn-warning"
                        onclick="showPage('banners')">
                        🖼️ Manage Banners
                    </button>

                </div>

            </div>

        </div>

async function loadDashboardStats(){

    const usersSnap =
        await db.ref("users")
        .once("value");

    let users = 0;
    let balance = 0;
    let referrals = 0;

    usersSnap.forEach(child=>{

        const u =
            child.val() || {};

        users++;

        balance +=
            Number(u.balance || 0);

        referrals +=
            Number(u.totalReferrals || 0);

    });

    document.getElementById("statUsers")
        .innerText = users;

    document.getElementById("statBalance")
        .innerText =
        "৳"+money(balance);

    document.getElementById("statRefer")
        .innerText = referrals;

    const withdrawSnap =
        await db.ref("withdrawals")
        .orderByChild("status")
        .equalTo("pending")
        .once("value");

    let pending = 0;

    withdrawSnap.forEach(()=>{
        pending++;
    });

    document.getElementById("statWithdraw")
        .innerText = pending;

}

async function changeBalance(id,type){

    const amount =
        Number(
            document.getElementById("balanceAmount")
            .value
        );

    if(!amount || amount <= 0){

        toast("Enter valid amount");

        return;

    }

    const ref =
        db.ref("users/"+id);

    const snap =
        await ref.once("value");

    const user =
        snap.val() || {};

    let balance =
        Number(user.balance || 0);

    if(type === "add"){

        balance += amount;

    }else{

        if(amount > balance){

            toast("Insufficient balance");

            return;

        }

        balance -= amount;

    }

    await ref.update({
        balance:balance
    });

    await db.ref("transactions").push({

        userId:id,

        type:
            type === "add"
            ? "admin_add"
            : "admin_deduct",

        amount:amount,

        adminUid:auth.currentUser.uid,

        status:"completed",

        createdAt:
            firebase.database.ServerValue.TIMESTAMP

    });

    toast("Balance updated");

    closeModal();

    renderUsers();

}

/* =========================================================
   APPROVE WITHDRAW
========================================================= */

async function approveWithdraw(id){

    if(!confirm("Approve this withdrawal?"))
        return;

    const ref =
        db.ref("withdrawals/"+id);

    const snap =
        await ref.once("value");

    const w =
        snap.val();

    if(!w){

        toast("Request not found");

        return;

    }

    if(w.status !== "pending"){

        toast("Already processed");

        return;

    }

    const userRef =
        db.ref("users/"+w.userId);

    const userSnap =
        await userRef.once("value");

    const user =
        userSnap.val() || {};

    const balance =
        Number(user.balance || 0);

    const amount =
        Number(w.amount || 0);

    if(amount > balance){

        await ref.update({
            status:"rejected",
            adminNote:"Insufficient user balance"
        });

        toast("Insufficient user balance");

        renderWithdrawals();

        return;

    }

    /*
       NOTE:
       For production money handling, this operation
       should be moved to a trusted backend transaction.
    */

    await userRef.update({

        balance:
            balance-amount,

        totalWithdraw:
            Number(user.totalWithdraw || 0)+amount

    });

    await ref.update({

        status:"approved",

        processedAt:
            firebase.database.ServerValue.TIMESTAMP,

        processedBy:
            auth.currentUser.uid

    });

    await db.ref("transactions").push({

        userId:w.userId,

        type:"withdraw",

        amount:amount,

        withdrawalId:id,

        status:"completed",

        createdAt:
            firebase.database.ServerValue.TIMESTAMP

    });

    toast("Withdrawal approved");

    renderWithdrawals();

}


/* =========================================================
   REJECT WITHDRAW
========================================================= */

async function rejectWithdraw(id){

    const note =
        prompt("Rejection reason:");

    const ref =
        db.ref("withdrawals/"+id);

    const snap =
        await ref.once("value");

    const w =
        snap.val();

    if(!w) return;

    if(w.status !== "pending"){

        toast("Already processed");

        return;

    }

    await ref.update({

        status:"rejected",

        adminNote:
            note || "Rejected",

        processedAt:
            firebase.database.ServerValue.TIMESTAMP,

        processedBy:
            auth.currentUser.uid

    });

    toast("Withdrawal rejected");

    renderWithdrawals();

}

/* =========================================================
   DELETE
========================================================= */

async function deleteItem(path,id){

    if(!confirm("Delete this item?"))
        return;

    await db.ref(path+"/"+id)
        .remove();

    toast("Deleted");

    if(path === "banners")
        renderBanners();

    if(path === "tasks")
        renderTasks();

    if(path === "withdrawMethods")
        renderMethods();

    if(path === "notices")
        renderNotices();

}
