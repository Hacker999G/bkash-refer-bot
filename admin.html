<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
    --pink:#e2136e;
    --pink2:#f52f82;
    --dark:#171719;
    --bg:#f5f6f8;
    --white:#fff;
    --text:#202124;
    --muted:#777;
    --green:#12a36a;
    --red:#ef4444;
    --orange:#f59e0b;
    --blue:#3b82f6;
    --border:#e9e9ed;
}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);}
button,input,select,textarea{font-family:inherit;}
button{cursor:pointer;border:0;}
.hidden{display:none!important;}

/* LOGIN */
.login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:radial-gradient(circle at 10% 10%,#ff79ae 0,transparent 28%),radial-gradient(circle at 90% 90%,#e2136e 0,transparent 30%),#f7f7f8;
}
.login-box{width:100%;max-width:420px;background:white;border-radius:28px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.12);}
.logo{width:65px;height:65px;margin:0 auto 15px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--pink),#ff579a);color:white;font-size:28px;font-weight:900;}
.login-box h1{text-align:center;font-size:24px;}
.login-box p{text-align:center;color:#888;font-size:12px;margin-top:7px;margin-bottom:22px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11px;font-weight:800;color:#555;margin-bottom:7px;}
.input,.select,.textarea{width:100%;border:1px solid var(--border);border-radius:13px;height:48px;padding:0 13px;outline:none;background:#fff;font-size:13px;}
.textarea{height:100px;padding:12px;resize:vertical;}
.input:focus,.select:focus,.textarea:focus{border-color:var(--pink);}
.btn{min-height:43px;border-radius:12px;padding:0 15px;font-size:12px;font-weight:800;}
.btn-primary{background:var(--pink);color:white;}
.btn-secondary{background:#f2f3f5;color:#333;}
.btn-success{background:var(--green);color:white;}
.btn-danger{background:var(--red);color:white;}
.btn-warning{background:var(--orange);color:white;}
.btn-blue{background:var(--blue);color:white;}

/* APP LAYOUT */
.app{min-height:100vh;}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:245px;background:#171719;color:white;z-index:100;overflow:auto;}
.brand{padding:22px 20px;font-size:20px;font-weight:900;border-bottom:1px solid rgba(255,255,255,.08);}
.brand span{color:#ff4c95;}
.admin-info{padding:15px 20px;font-size:10px;color:#999;border-bottom:1px solid rgba(255,255,255,.08);}
.nav{padding:12px;}
.nav-btn{width:100%;height:44px;border-radius:11px;margin-bottom:4px;background:transparent;color:#aaa;display:flex;align-items:center;gap:12px;padding:0 13px;text-align:left;font-size:12px;font-weight:700;}
.nav-btn:hover{background:rgba(255,255,255,.06);color:white;}
.nav-btn.active{background:var(--pink);color:white;}
.nav-icon{width:23px;text-align:center;font-size:17px;}
.main{margin-left:245px;min-height:100vh;}
.topbar{height:68px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:50;}
.page-title{font-size:19px;font-weight:900;}
.top-right{display:flex;align-items:center;gap:9px;}
.content{padding:24px;max-width:1450px;}

/* CARDS & STATS */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;}
.card{background:white;border:1px solid var(--border);border-radius:17px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.025);}
.stat-card{display:flex;align-items:center;gap:14px;}
.stat-icon{width:50px;height:50px;border-radius:15px;background:#fff0f6;color:var(--pink);display:flex;align-items:center;justify-content:center;font-size:23px;}
.stat-label{font-size:10px;color:#888;}
.stat-value{font-size:22px;font-weight:900;margin-top:4px;}

/* SECTION */
.section{margin-top:20px;}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;}
.section-title{font-size:16px;font-weight:900;}
.actions{display:flex;flex-wrap:wrap;gap:8px;}

/* TABLES */
.table-wrap{background:white;border:1px solid var(--border);border-radius:17px;overflow:auto;}
table{width:100%;border-collapse:collapse;min-width:700px;}
th{background:#fafafa;color:#777;font-size:10px;text-align:left;padding:13px;border-bottom:1px solid var(--border);}
td{padding:13px;border-bottom:1px solid #f0f0f0;font-size:11px;vertical-align:middle;}
tr:last-child td{border-bottom:0;}
.user-cell{display:flex;align-items:center;gap:9px;}
.user-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#eee;}
.user-name{font-weight:800;}
.user-id{color:#999;font-size:9px;margin-top:2px;}
.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:20px;font-size:9px;font-weight:800;}
.badge-green{color:#087d50;background:#e5f8ef;}
.badge-red{color:#b91c1c;background:#feecec;}
.badge-orange{color:#a16207;background:#fff5d9;}
.badge-blue{color:#1d4ed8;background:#eaf1ff;}
.thumb{width:50px;height:35px;object-fit:cover;border-radius:6px;}

/* SEARCH & MODAL */
.search{width:260px;max-width:100%;height:42px;border:1px solid var(--border);border-radius:11px;padding:0 12px;outline:none;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
.modal.show{display:flex;}
.modal-box{width:100%;max-width:600px;max-height:90vh;overflow:auto;background:white;border-radius:22px;}
.modal-head{position:sticky;top:0;z-index:2;background:white;border-bottom:1px solid var(--border);padding:17px 19px;display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-weight:900;font-size:17px;}
.close{width:35px;height:35px;border-radius:50%;background:#f2f2f4;font-size:18px;}
.modal-body{padding:19px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.full{grid-column:1/-1;}
.empty{padding:40px;text-align:center;color:#999;font-size:12px;}
.mobile-menu{display:none;}

@media(max-width:900px){
    .sidebar{transform:translateX(-100%);transition:.25s;}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;}
    .mobile-menu{display:block;width:40px;height:40px;border-radius:10px;background:#f2f2f4;font-size:19px;}
    .cards{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:600px){
    .content{padding:15px;}
    .topbar{padding:0 15px;}
    .page-title{font-size:16px;}
    .cards{gap:9px;}
    .card{padding:13px;}
    .stat-icon{width:42px;height:42px;}
    .stat-value{font-size:18px;}
    .form-grid{grid-template-columns:1fr;}
    .full{grid-column:auto;}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <div class="logo">৳</div>
        <h1>Admin Panel</h1>
        <p>Secure administrator login</p>
        <div class="field">
            <label>EMAIL</label>
            <input id="loginEmail" class="input" type="email" placeholder="Admin email" value="admin@devgopal.com">
        </div>
        <div class="field">
            <label>PASSWORD</label>
            <input id="loginPassword" class="input" type="password" placeholder="Password" onkeydown="if(event.key==='Enter') login()">
        </div>
        <button class="btn btn-primary" style="width:100%;height:49px" onclick="login()">LOGIN TO ADMIN</button>
        <div id="loginError" style="color:#ef4444;font-size:11px;text-align:center;margin-top:12px"></div>
    </div>
</div>

<!-- ADMIN APP -->
<div id="adminApp" class="app hidden">
    <aside id="sidebar" class="sidebar">
        <div class="brand"><span>৳</span> Admin Panel</div>
        <div class="admin-info">ADMINISTRATOR<br><span id="adminEmail">admin@devgopal.com</span></div>
        <nav class="nav">
            <button class="nav-btn active" onclick="showPage('dashboard',this)"><span class="nav-icon">📊</span> Dashboard</button>
            <button class="nav-btn" onclick="showPage('users',this)"><span class="nav-icon">👤</span> Users</button>
            <button class="nav-btn" onclick="showPage('withdrawals',this)"><span class="nav-icon">💸</span> Withdrawals</button>
            <button class="nav-btn" onclick="showPage('banners',this)"><span class="nav-icon">🖼️</span> Banners</button>
            <button class="nav-btn" onclick="showPage('tasks',this)"><span class="nav-icon">🎯</span> Tasks</button>
            <button class="nav-btn" onclick="showPage('methods',this)"><span class="nav-icon">💳</span> Withdraw Methods</button>
            <button class="nav-btn" onclick="showPage('notices',this)"><span class="nav-icon">🔔</span> Notices</button>
            <button class="nav-btn" onclick="showPage('settings',this)"><span class="nav-icon">⚙️</span> Settings</button>
            <button class="nav-btn" onclick="showPage('support',this)"><span class="nav-icon">🆘</span> Support</button>
            <button class="nav-btn" onclick="showPage('tutorial',this)"><span class="nav-icon">🎬</span> Tutorial</button>
            <button class="nav-btn" onclick="logout()" style="margin-top:12px;color:#ff6d6d"><span class="nav-icon">↪</span> Logout</button>
        </nav>
    </aside>

    <main class="main">
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:10px">
                <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
                <div id="pageTitle" class="page-title">Dashboard</div>
            </div>
            <div class="top-right"><span id="topBotName" style="font-size:11px;color:#777">Loading...</span></div>
        </header>
        <div id="content" class="content"></div>
    </main>
</div>

<!-- MODAL -->
<div id="modal" class="modal" onclick="outsideModal(event)">
    <div class="modal-box">
        <div class="modal-head">
            <div id="modalTitle" class="modal-title">Modal</div>
            <button class="close" onclick="closeModal()">×</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
    </div>
</div>

<script>
/* FIREBASE CONFIG */
const firebaseConfig = {
    apiKey: "AIzaSyDDW-mPGwDxZhETSDWw-we41zy2hHtT1Kc",
    authDomain: "bkash-refer-bot.firebaseapp.com",
    databaseURL: "https://bkash-refer-bot-default-rtdb.firebaseio.com",
    projectId: "bkash-refer-bot",
    storageBucket: "bkash-refer-bot.firebasestorage.app",
    messagingSenderId: "642702342319",
    appId: "1:642702342319:web:2f92be0cf13d77b3773c5a",
    measurementId: "G-ZB8XWS70W4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const ADMIN_EMAIL = "admin@devgopal.com";
const ADMIN_PASS = "@DEV_GOPAL";

let currentPage = "dashboard";
let usersCache = {};
let settings = {};

window.addEventListener("DOMContentLoaded", () => {
    if(localStorage.getItem("isAdminLoggedIn") === "true"){
        appLoginSuccess();
    }
});

function esc(value){
    if(value === null || value === undefined) return "";
    return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function money(value){
    return Number(value || 0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function toast(message){ alert(message); }

function login(){
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const error = document.getElementById("loginError");
    error.innerText = "";

    if(!email || !password){
        error.innerText = "Enter email and password.";
        return;
    }

    if(email.toLowerCase() === ADMIN_EMAIL.toLowerCase() && password === ADMIN_PASS){
        localStorage.setItem("isAdminLoggedIn", "true");
        appLoginSuccess();
    } else {
        error.innerText = "Invalid admin email or password.";
    }
}

async function appLoginSuccess(){
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("adminApp").classList.remove("hidden");
    try{
        await loadSettings();
        showPage("dashboard");
    }catch(e){
        console.error("Admin startup:", e);
    }
}

function logout(){
    localStorage.removeItem("isAdminLoggedIn");
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("adminApp").classList.add("hidden");
    document.getElementById("loginPassword").value = "";
}

function showPage(page, button){
    currentPage = page;
    document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
    if(button) button.classList.add("active");

    const titles = {
        dashboard:"Dashboard", users:"Users", withdrawals:"Withdraw Requests",
        banners:"Banner Manager", tasks:"Task Manager", methods:"Withdraw Methods",
        notices:"Notice Manager", settings:"Bot Settings", support:"Support Manager", tutorial:"Tutorial Manager"
    };

    document.getElementById("pageTitle").innerText = titles[page] || "Admin";
    document.getElementById("sidebar").classList.remove("open");

    const pages = {
        dashboard:renderDashboard, users:renderUsers, withdrawals:renderWithdrawals,
        banners:renderBanners, tasks:renderTasks, methods:renderMethods,
        notices:renderNotices, settings:renderSettings, support:renderSupport, tutorial:renderTutorial
    };

    if(pages[page]) pages[page]();
}

function toggleSidebar(){ document.getElementById("sidebar").classList.toggle("open"); }

function openModal(title, html){
    document.getElementById("modalTitle").innerText = title;
    document.getElementById("modalBody").innerHTML = html;
    document.getElementById("modal").classList.add("show");
}
function closeModal(){ document.getElementById("modal").classList.remove("show"); }
function outsideModal(e){ if(e.target.id === "modal") closeModal(); }

async function loadSettings(){
    const snap = await db.ref("settings").once("value");
    settings = snap.val() || {};
    document.getElementById("topBotName").innerText = settings.botName || "Bot";
}

/* DASHBOARD */
async function renderDashboard(){
    const content = document.getElementById("content");
    content.innerHTML = `
        <div class="cards">
            <div class="card stat-card"><div class="stat-icon">👤</div><div><div class="stat-label">TOTAL USERS</div><div id="statUsers" class="stat-value">...</div></div></div>
            <div class="card stat-card"><div class="stat-icon">💰</div><div><div class="stat-label">TOTAL BALANCE</div><div id="statBalance" class="stat-value">...</div></div></div>
            <div class="card stat-card"><div class="stat-icon">💸</div><div><div class="stat-label">PENDING WITHDRAW</div><div id="statWithdraw" class="stat-value">...</div></div></div>
            <div class="card stat-card"><div class="stat-icon">👥</div><div><div class="stat-label">TOTAL REFERRALS</div><div id="statRefer" class="stat-value">...</div></div></div>
        </div>
        <div class="section">
            <div class="section-head"><div class="section-title">Quick Actions</div></div>
            <div class="card"><div class="actions">
                <button class="btn btn-primary" onclick="showPage('users')">👤 Manage Users</button>
                <button class="btn btn-success" onclick="showPage('withdrawals')">💸 Withdrawals</button>
                <button class="btn btn-blue" onclick="showPage('tasks')">🎯 Manage Tasks</button>
                <button class="btn btn-warning" onclick="showPage('banners')">🖼️ Manage Banners</button>
            </div></div>
        </div>
    `;
    await loadDashboardStats();
}

async function loadDashboardStats(){
    const usersSnap = await db.ref("users").once("value");
    let users = 0, balance = 0, referrals = 0;
    usersSnap.forEach(child => {
        const u = child.val() || {};
        users++;
        balance += Number(u.balance || 0);
        referrals += Number(u.totalReferrals || 0);
    });
    document.getElementById("statUsers").innerText = users;
    document.getElementById("statBalance").innerText = "৳" + money(balance);
    document.getElementById("statRefer").innerText = referrals;

    const withdrawSnap = await db.ref("withdrawals").orderByChild("status").equalTo("pending").once("value");
    let pending = 0;
    withdrawSnap.forEach(() => { pending++; });
    document.getElementById("statWithdraw").innerText = pending;
}

/* USERS */
async function renderUsers(){
    const content = document.getElementById("content");
    content.innerHTML = `
        <div class="section-head">
            <div class="section-title">All Users</div>
            <input id="userSearch" class="search" placeholder="Search name, username or ID..." oninput="filterUsers()">
        </div>
        <div id="usersTable" class="table-wrap"><div class="empty">Loading users...</div></div>
    `;
    const snap = await db.ref("users").once("value");
    usersCache = {};
    snap.forEach(child => { usersCache[child.key] = child.val() || {}; });
    renderUsersTable(Object.entries(usersCache));
}

function filterUsers(){
    const q = document.getElementById("userSearch").value.toLowerCase();
    const filtered = Object.entries(usersCache).filter(([id, u]) => {
        const name = (u.firstName + " " + u.lastName).toLowerCase();
        const username = (u.username || "").toLowerCase();
        return id.toLowerCase().includes(q) || name.includes(q) || username.includes(q);
    });
    renderUsersTable(filtered);
}

function renderUsersTable(entries){
    if(!entries.length){
        document.getElementById("usersTable").innerHTML = `<div class="empty">No users found.</div>`;
        return;
    }
    let rows = "";
    entries.forEach(([id, u]) => {
        const name = [u.firstName || "", u.lastName || ""].join(" ").trim() || "User";
        rows += `
            <tr>
                <td>
                    <div class="user-cell">
                        <img class="user-avatar" src="${esc(u.photoUrl || "https://ui-avatars.com/api/?name=User")}">
                        <div>
                            <div class="user-name">${esc(name)}</div>
                            <div class="user-id">ID: ${esc(id)}</div>
                        </div>
                    </div>
                </td>
                <td>${u.username ? "@"+esc(u.username) : "-"}</td>
                <td><b>৳${money(u.balance)}</b></td>
                <td>${u.totalReferrals || 0}</td>
                <td>${u.status === "banned" ? `<span class="badge badge-red">BANNED</span>` : `<span class="badge badge-green">ACTIVE</span>`}</td>
                <td>
                    <div class="actions">
                        <button class="btn btn-secondary" onclick="editUser('${esc(id)}')">Edit</button>
                        <button class="btn ${u.status === 'banned' ? 'btn-success' : 'btn-danger'}" onclick="toggleBanUser('${esc(id)}')">${u.status === 'banned' ? 'Unban' : 'Ban'}</button>
                    </div>
                </td>
            </tr>
        `;
    });
    document.getElementById("usersTable").innerHTML = `<table><thead><tr><th>User</th><th>Username</th><th>Balance</th><th>Referrals</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function editUser(id){
    const u = usersCache[id] || {};
    openModal("Edit User", `
        <div class="form-grid">
            <div class="field"><label>First Name</label><input id="editFirstName" class="input" value="${esc(u.firstName)}"></div>
            <div class="field"><label>Last Name</label><input id="editLastName" class="input" value="${esc(u.lastName)}"></div>
            <div class="field"><label>Balance (৳)</label><input id="editBalance" class="input" type="number" value="${u.balance || 0}"></div>
            <div class="field"><label>Total Referrals</label><input id="editReferrals" class="input" type="number" value="${u.totalReferrals || 0}"></div>
            <div class="full"><button class="btn btn-primary" style="width:100%" onclick="saveUser('${esc(id)}')">Save Changes</button></div>
        </div>
    `);
}

async function saveUser(id){
    const firstName = document.getElementById("editFirstName").value.trim();
    const lastName = document.getElementById("editLastName").value.trim();
    const balance = Number(document.getElementById("editBalance").value || 0);
    const totalReferrals = Number(document.getElementById("editReferrals").value || 0);

    await db.ref("users/" + id).update({ firstName, lastName, balance, totalReferrals });
    toast("User updated successfully!");
    closeModal();
    renderUsers();
}

async function toggleBanUser(id){
    const u = usersCache[id] || {};
    const newStatus = u.status === "banned" ? "active" : "banned";
    await db.ref("users/" + id).update({ status: newStatus });
    toast("User status updated!");
    renderUsers();
}

/* WITHDRAWALS */
async function renderWithdrawals(){
    const content = document.getElementById("content");
    content.innerHTML = `<div class="section-head"><div class="section-title">Withdraw Requests</div></div><div id="withdrawTable" class="table-wrap"><div class="empty">Loading withdrawals...</div></div>`;
    const snap = await db.ref("withdrawals").once("value");
    let rows = "";
    snap.forEach(child => {
        const w = child.val() || {};
        const id = child.key;
        rows += `
            <tr>
                <td>${esc(w.userId)}</td>
                <td><b>৳${money(w.amount)}</b></td>
                <td>${esc(w.method)}<br><small>${esc(w.account)}</small></td>
                <td><span class="badge ${w.status==='approved'?'badge-green':w.status==='rejected'?'badge-red':'badge-orange'}">${esc(w.status || 'pending').toUpperCase()}</span></td>
                <td>
                    ${w.status === 'pending' ? `
                        <div class="actions">
                            <button class="btn btn-success" onclick="updateWithdraw('${id}','approved')">Approve</button>
                            <button class="btn btn-danger" onclick="updateWithdraw('${id}','rejected')">Reject</button>
                        </div>
                    ` : '-'}
                </td>
            </tr>
        `;
    });
    document.getElementById("withdrawTable").innerHTML = rows ? `<table><thead><tr><th>User ID</th><th>Amount</th><th>Method / Account</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty">No withdrawals found.</div>`;
}

async function updateWithdraw(id, status){
    await db.ref("withdrawals/" + id).update({ status });
    toast("Withdrawal " + status);
    renderWithdrawals();
}

/* BANNERS MANAGER (Image Link + Add/Edit/Delete) */
async function renderBanners(){
    const content = document.getElementById("content");
    content.innerHTML = `
        <div class="section-head"><div class="section-title">Banner Manager</div><button class="btn btn-primary" onclick="openBannerModal()">Add Banner</button></div>
        <div id="bannerTable" class="table-wrap"><div class="empty">Loading banners...</div></div>
    `;
    const snap = await db.ref("banners").once("value");
    let rows = "";
    snap.forEach(child => {
        const b = child.val() || {};
        const id = child.key;
        rows += `
            <tr>
                <td><img class="thumb" src="${esc(b.imgUrl)}"></td>
                <td>${esc(b.title || "Banner")}</td>
                <td><a href="${esc(b.imgUrl)}" target="_blank" style="color:var(--blue);">View Link</a></td>
                <td>
                    <div class="actions">
                        <button class="btn btn-secondary" onclick="openBannerModal('${id}','${esc(b.title)}','${esc(b.imgUrl)}')">Edit</button>
                        <button class="btn btn-danger" onclick="deleteItem('banners','${id}')">Delete</button>
                    </div>
                </td>
            </tr>
        `;
    });
    document.getElementById("bannerTable").innerHTML = rows ? `<table><thead><tr><th>Image</th><th>Title</th><th>URL</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty">No banners found.</div>`;
}

function openBannerModal(id = "", title = "", imgUrl = ""){
    openModal(id ? "Edit Banner" : "Add Banner", `
        <div class="field"><label>Banner Title</label><input id="bannerTitle" class="input" value="${title}"></div>
        <div class="field"><label>Banner Image Link (URL)</label><input id="bannerImgUrl" class="input" value="${imgUrl}"></div>
        <button class="btn btn-primary" style="width:100%" onclick="saveBanner('${id}')">Save Banner</button>
    `);
}

async function saveBanner(id){
    const title = document.getElementById("bannerTitle").value.trim();
    const imgUrl = document.getElementById("bannerImgUrl").value.trim();
    if(!imgUrl) return toast("Provide an image link.");

    if(id){
        await db.ref("banners/" + id).set({ title, imgUrl });
    } else {
        await db.ref("banners").push({ title, imgUrl });
    }
    closeModal();
    renderBanners();
}

/* GENERIC NOTICE / SUPPORT / TUTORIAL MANAGERS */
async function renderGenericManager(title, path){
    const content = document.getElementById("content");
    content.innerHTML = `
        <div class="section-head"><div class="section-title">${title}</div><button class="btn btn-primary" onclick="openGenericModal('${path}','${title}')">Add New</button></div>
        <div id="genTable" class="table-wrap"><div class="empty">Loading...</div></div>
    `;
    const snap = await db.ref(path).once("value");
    let rows = "";
    snap.forEach(child => {
        const item = child.val() || {};
        const id = child.key;
        rows += `
            <tr>
                <td><b>${esc(item.title || item.text || item.link || id)}</b></td>
                <td><a href="${esc(item.link || '#')}" target="_blank" style="color:var(--blue);">${esc(item.link || '')}</a></td>
                <td>
                    <div class="actions">
                        <button class="btn btn-danger" onclick="deleteItem('${path}','${id}')">Delete</button>
                    </div>
                </td>
            </tr>
        `;
    });
    document.getElementById("genTable").innerHTML = rows ? `<table><thead><tr><th>Content / Title</th><th>Link</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty">No items found.</div>`;
}

function openGenericModal(path, title){
    openModal("Add " + title, `
        <div class="field"><label>Title / Text</label><input id="genTitle" class="input"></div>
        <div class="field"><label>Link (Optional)</label><input id="genLink" class="input"></div>
        <button class="btn btn-primary" style="width:100%" onclick="saveGenericItem('${path}')">Save</button>
    `);
}

async function saveGenericItem(path){
    const title = document.getElementById("genTitle").value.trim();
    const link = document.getElementById("genLink").value.trim();
    if(!title) return;
    await db.ref(path).push({ title, link });
    closeModal();
    showPage(currentPage);
}

async function deleteItem(path, id){
    if(confirm("Are you sure you want to delete this?")){
        await db.ref(path + "/" + id).remove();
        showPage(currentPage);
    }
}

function renderNotices(){ renderGenericManager("Notice Manager", "notices"); }
function renderSupport(){ renderGenericManager("Support Manager", "support"); }
function renderTutorial(){ renderGenericManager("Tutorial Manager", "tutorials"); }
